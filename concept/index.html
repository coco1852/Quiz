ong>전에</strong> commit</td>\n<td><strong>아무것도 안 함</strong> (CP 때 이미 디스크 반영)</td>\n</tr>\n<tr>\n<td>T2</td>\n<td>CP 전 시작, 장애 전 commit</td>\n<td><strong>Redo</strong></td>\n</tr>\n<tr>\n<td>T3</td>\n<td>CP 전 시작, 장애 때 실행 중</td>\n<td><strong>Undo</strong></td>\n</tr>\n<tr>\n<td>T4</td>\n<td>CP 후 시작, 장애 전 commit</td>\n<td><strong>Redo</strong></td>\n</tr>\n<tr>\n<td>T5</td>\n<td>CP 후 시작, 장애 때 실행 중</td>\n<td><strong>Undo</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>판정 2단계 (즉시 갱신 기준)</strong></p>\n<ol>\n<li>장애 전에 commit 있나? → 있으면 <strong>Redo</strong>, 없으면 <strong>Undo</strong></li>\n<li>그 commit이 CP보다도 앞이면? → <strong>아무것도 안 함</strong></li>\n</ol>\n<blockquote>\n<p>⚠️ 최다 함정: T1을 Redo로 찍기. <strong>CP 이전에 완료된 트랜잭션은 회복 대상 아님.</strong>\n- 지연 갱신 버전이면 T3·T5는 Undo가 아니라 <strong>그냥 무시</strong>(로그 버림)\n- 체크포인트의 목적 = 회복 시 <strong>로그 전체를 다 훑지 않도록</strong> 탐색 범위 축소</p>\n</blockquote>"}, {"id": "db7", "subject": "db", "subjectName": "데이터베이스", "title": "UNION vs UNION ALL", "html": "<p><strong>한 칼 구분: ALL = \"다(All) 나와\" = 중복 유지.</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>UNION</th>\n<th>UNION ALL</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>중복</td>\n<td>제거</td>\n<td>유지</td>\n</tr>\n<tr>\n<td>내부 동작</td>\n<td>중복 제거(정렬/해시) 비용 발생</td>\n<td>그냥 이어붙임 → <strong>빠름</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>예시</strong>: A = {1, 2, 3}, B = {2, 3, 4}</p>\n<ul>\n<li>UNION → 1,2,3,4 (<strong>4행</strong>)</li>\n<li>UNION ALL → 1,2,3,2,3,4 (<strong>6행</strong>)</li>\n</ul>\n<blockquote>\n<p>⚠️ 함정: 두 SELECT의 <strong>컬럼 수와 데이터 타입(순서대로)이 호환</strong>되어야 함. 컬럼 \"이름\"이 같을 필요는 없음. 결과 행 수 계산 문제 나오면 중복 개수부터 셀 것.</p>\n</blockquote>"}, {"id": "sw1", "subject": "sw", "subjectName": "소프트웨어공학", "title": "결합도 · 응집도", "html": "<p><strong>한 칼 구분: 결합도는 낮을수록, 응집도는 높을수록 좋다. \"결낮응높\".</strong></p>\n<p><strong>결합도 (강함=나쁨 → 약함=좋음)</strong></p>\n<pre><code>내용 &gt; 공통 &gt; 외부 &gt; 제어 &gt; 스탬프 &gt; 자료\n</code></pre>\n<p>암기: <strong>내공외제스자</strong> (\"내 공은 외제, 스스로 자랑\")</p>\n<table>\n<thead>\n<tr>\n<th>결합도</th>\n<th>키워드</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>내용</td>\n<td>다른 모듈 내부를 직접 참조·수정</td>\n</tr>\n<tr>\n<td>공통</td>\n<td>전역 변수 공유</td>\n</tr>\n<tr>\n<td>외부</td>\n<td>외부 선언 데이터(프로토콜, 통신 포맷) 공유</td>\n</tr>\n<tr>\n<td>제어</td>\n<td><strong>제어 플래그</strong>(flag) 전달, 상대 논리 흐름 통제</td>\n</tr>\n<tr>\n<td>스탬프</td>\n<td><strong>구조체·배열 전체</strong> 전달</td>\n</tr>\n<tr>\n<td>자료</td>\n<td>필요한 <strong>값(파라미터)만</strong> 전달 — 최선</td>\n</tr>\n</tbody>\n</table>\n<p><strong>응집도 (낮음=나쁨 → 높음=좋음)</strong></p>\n<pre><code>우연 &lt; 논리 &lt; 시간 &lt; 절차 &lt; 통신 &lt; 순차 &lt; 기능\n</code></pre>\n<p>암기: <strong>우논시절 통순기</strong> (\"우스운 논리도 시절 지나면 통하는 순간이 기막히다\")</p>\n<table>\n<thead>\n<tr>\n<th>응집도</th>\n<th>키워드</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>우연</td>\n<td>아무 관계 없는 것들 모임</td>\n</tr>\n<tr>\n<td>논리</td>\n<td>유사 성격끼리, 파라미터로 골라 실행</td>\n</tr>\n<tr>\n<td>시간</td>\n<td><strong>같은 시점</strong>에 실행 (초기화 모듈)</td>\n</tr>\n<tr>\n<td>절차</td>\n<td>순서대로 수행, 데이터 연결은 약함</td>\n</tr>\n<tr>\n<td>통신</td>\n<td><strong>같은 입출력 데이터</strong> 사용</td>\n</tr>\n<tr>\n<td>순차</td>\n<td><strong>앞 출력 = 뒤 입력</strong></td>\n</tr>\n<tr>\n<td>기능</td>\n<td>단일 기능 수행 — 최선</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>⚠️ 경계혼동 최다 출제\n- 스탬프 vs 자료: 구조체 통째면 스탬프, 값만 뽑아 주면 자료\n- 절차 vs 순차: 출력→입력으로 <strong>데이터가 이어지면 순차</strong>, 순서만 있으면 절차\n- 시간 vs 절차: 순서 상관없이 \"같은 때\"면 시간(init)\n- \"가장 바람직한 결합도는?\" → 자료 / \"가장 바람직한 응집도는?\" → 기능</p>\n</blockquote>"}, {"id": "sw2", "subject": "sw", "subjectName": "소프트웨어공학", "title": "디자인 패턴", "html": "<p><strong>한 칼 구분: 만들면 생성, 감싸고 연결하면 구조, 주고받고 행동하면 행위.</strong></p>\n<table>\n<thead>\n<tr>\n<th>분류</th>\n<th>패턴</th>\n<th>한 줄 특징</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>생성 (5)</strong></td>\n<td>Singleton</td>\n<td>인스턴스 <strong>1개</strong> 보장 (Spring Bean 기본 스코프)</td>\n</tr>\n<tr>\n<td></td>\n<td>Factory Method</td>\n<td>생성을 서브클래스에 위임</td>\n</tr>\n<tr>\n<td></td>\n<td>Abstract Factory</td>\n<td><strong>관련 객체군</strong>을 묶어 생성</td>\n</tr>\n<tr>\n<td></td>\n<td>Builder</td>\n<td>복잡한 객체를 단계별 조립 (<code>@Builder</code>)</td>\n</tr>\n<tr>\n<td></td>\n<td>Prototype</td>\n<td>원형 <strong>복제(clone)</strong>로 생성</td>\n</tr>\n<tr>\n<td><strong>구조 (7)</strong></td>\n<td>Adapter</td>\n<td><strong>인터페이스 변환</strong> (호환)</td>\n</tr>\n<tr>\n<td></td>\n<td>Bridge</td>\n<td>구현부와 추상부 <strong>분리</strong>해 독립 확장</td>\n</tr>\n<tr>\n<td></td>\n<td>Composite</td>\n<td>트리 구조, 부분-전체 <strong>동일 취급</strong></td>\n</tr>\n<tr>\n<td></td>\n<td>Decorator</td>\n<td>기능을 <strong>동적으로 덧씌움</strong> (Java IO 스트림)</td>\n</tr>\n<tr>\n<td></td>\n<td>Facade</td>\n<td>복잡한 서브시스템에 <strong>단일 창구</strong></td>\n</tr>\n<tr>\n<td></td>\n<td>Flyweight</td>\n<td>인스턴스 <strong>공유</strong>로 메모리 절약</td>\n</tr>\n<tr>\n<td></td>\n<td>Proxy</td>\n<td><strong>대리자</strong> 통해 접근 제어 (JPA 지연로딩!)</td>\n</tr>\n<tr>\n<td><strong>행위 (11)</strong></td>\n<td>Observer</td>\n<td>상태 변화 시 <strong>일괄 통지</strong> (이벤트 리스너)</td>\n</tr>\n<tr>\n<td></td>\n<td>Strategy</td>\n<td>알고리즘을 <strong>교체 가능</strong>하게 캡슐화</td>\n</tr>\n<tr>\n<td></td>\n<td>Template Method</td>\n<td>골격은 상위, 세부는 하위 재정의</td>\n</tr>\n<tr>\n<td></td>\n<td>Command</td>\n<td>요청 자체를 <strong>객체화</strong></td>\n</tr>\n<tr>\n<td></td>\n<td>State</td>\n<td>상태에 따라 행위 변경</td>\n</tr>\n<tr>\n<td></td>\n<td>Iterator</td>\n<td>내부 구조 노출 없이 순회</td>\n</tr>\n<tr>\n<td></td>\n<td>Mediator</td>\n<td>객체 간 통신을 <strong>중재자</strong>로 집중</td>\n</tr>\n<tr>\n<td></td>\n<td>Chain of Responsibility</td>\n<td>처리자 사슬 따라 전달 (Filter 체인)</td>\n</tr>\n<tr>\n<td></td>\n<td>Memento</td>\n<td>상태 <strong>저장·복원</strong> (undo)</td>\n</tr>\n<tr>\n<td></td>\n<td>Visitor</td>\n<td>구조와 연산 분리</td>\n</tr>\n<tr>\n<td></td>\n<td>Interpreter</td>\n<td>문법 규칙을 클래스화</td>\n</tr>\n</tbody>\n</table>\n<p>암기(생성 5개): <strong>싱팩앱빌프</strong></p>\n<blockquote>\n<p>⚠️ 지문함정: \"분류가 다른 하나는?\" 유형 — <strong>Facade·Proxy·Adapter·Decorator는 구조</strong>, <strong>Observer·Strategy·State는 행위</strong>만 확실히 박아두면 대부분 컷.</p>\n</blockquote>"}, {"id": "sw3", "subject": "sw", "subjectName": "소프트웨어공학", "title": "UML 다이어그램", "html": "<p><strong>한 칼 구분: 그림에 시간·순서·상호작용이 있으면 행위(동적), 구조·관계만 있으면 구조(정적).</strong></p>\n<table>\n<thead>\n<tr>\n<th>구조(정적)</th>\n<th>행위(동적)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>클래스</strong></td>\n<td><strong>유스케이스</strong></td>\n</tr>\n<tr>\n<td><strong>객체</strong></td>\n<td><strong>시퀀스</strong> (상호작용)</td>\n</tr>\n<tr>\n<td>컴포넌트</td>\n<td>커뮤니케이션(협동) (상호작용)</td>\n</tr>\n<tr>\n<td>배치</td>\n<td>상태(State)</td>\n</tr>\n<tr>\n<td>패키지</td>\n<td>활동(Activity)</td>\n</tr>\n<tr>\n<td>복합체 구조</td>\n<td>타이밍 (상호작용)</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>클래스: 클래스·속성·연산·<strong>관계</strong>(일반화/집합/합성/의존)</li>\n<li>객체: 특정 <strong>시점의 인스턴스</strong> 스냅샷 → 그래도 <strong>구조</strong> 다이어그램!</li>\n<li>유스케이스: 액터-시스템 기능, <code>&lt;&lt;include&gt;&gt;</code>(필수 포함) / <code>&lt;&lt;extend&gt;&gt;</code>(조건부 확장)</li>\n<li>시퀀스: <strong>시간 순서</strong>, 생명선(lifeline), 메시지</li>\n</ul>\n<blockquote>\n<p>⚠️ 경계혼동\n- \"객체 다이어그램은 동적 다이어그램이다\" → X (인스턴스지만 <strong>정적</strong>)\n- include vs extend 방향: include는 기본→포함 기능, extend는 확장 기능→기본\n- 시퀀스 vs 커뮤니케이션: 같은 상호작용, 시퀀스는 <strong>시간축</strong>, 커뮤니케이션은 <strong>연결 관계</strong> 강조</p>\n</blockquote>"}, {"id": "sw4", "subject": "sw", "subjectName": "소프트웨어공학", "title": "화이트박스 · 블랙박스 테스트", "html": "<p><strong>한 칼 구분: 코드(내부 로직)를 보면 화이트, 명세(입출력)만 보면 블랙.</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>화이트박스</th>\n<th>블랙박스</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>기준</td>\n<td>소스 코드, 논리 경로</td>\n<td>요구사항 명세, 입출력</td>\n</tr>\n<tr>\n<td>별칭</td>\n<td>구조 테스트</td>\n<td>기능 테스트</td>\n</tr>\n<tr>\n<td>기법</td>\n<td><strong>기초 경로</strong>, <strong>조건 검사</strong>, <strong>루프 검사</strong>, <strong>데이터 흐름 검사</strong>, 문장/분기 커버리지</td>\n<td><strong>동치 분할</strong>, <strong>경계값 분석</strong>, <strong>원인-효과 그래프</strong>, 오류 예측, 비교 검사</td>\n</tr>\n</tbody>\n</table>\n<p>기법 판정 예시:</p>\n<ul>\n<li>\"1~100 입력 범위에서 0, 1, 100, 101을 테스트\" → <strong>경계값 분석</strong> (블랙)</li>\n<li>\"입력을 유효/무효 클래스로 나눠 대표값 선정\" → <strong>동치 분할</strong> (블랙)</li>\n<li>\"McCabe 순환 복잡도, 독립 경로 수\" → <strong>기초 경로 검사</strong> (화이트)</li>\n<li>순환 복잡도 V(G) = <strong>E − N + 2</strong> (간선 − 노드 + 2) = 분기 수 + 1</li>\n</ul>\n<blockquote>\n<p>⚠️ 지문함정: \"경계값 분석은 화이트박스 기법이다\" → X. 기법 이름 6~8개를 화/블로 즉시 분류하는 문제가 제일 흔함. <strong>커버리지 들어가면 무조건 화이트.</strong></p>\n</blockquote>"}, {"id": "sw5", "subject": "sw", "subjectName": "소프트웨어공학", "title": "통합 테스트 · 스텁 · 드라이버", "html": "<p><strong>한 칼 구분: 아직 없는 놈을 가짜로 만든다. 하향식은 아래가 없다 → 스텁(하위 가짜). 상향식은 위가 없다 → 드라이버(상위 가짜).</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>하향식 (Top-down)</th>\n<th>상향식 (Bottom-up)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>진행</td>\n<td>상위 → 하위 (깊이/너비 우선)</td>\n<td>하위 → 상위 (클러스터 묶음)</td>\n</tr>\n<tr>\n<td>가짜 모듈</td>\n<td><strong>스텁 (Stub)</strong> = 미완성 <strong>하위</strong> 대체</td>\n<td><strong>드라이버 (Driver)</strong> = 테스트 호출용 <strong>상위</strong> 대체</td>\n</tr>\n<tr>\n<td>장점</td>\n<td>설계 결함 조기 발견</td>\n<td>하위 모듈 검증 철저, 스텁보다 작성 쉬움</td>\n</tr>\n</tbody>\n</table>\n<p>암기: <strong>\"하-스, 상-드\"</strong> (하향식-스텁 / 상향식-드라이버)</p>\n<blockquote>\n<p>⚠️ 선지함정: \"상향식 통합에는 스텁이 필요하다\" → X. \"빅뱅 통합은 드라이버·스텁 없이 한 번에\" → O. 회귀(Regression) 테스트 = 변경 후 <strong>기존 기능 재확인</strong>도 세트로 자주 나옴.</p>\n</blockquote>"}, {"id": "sec1", "subject": "sec", "subjectName": "정보보안", "title": "보안 기본 (CIA · 위협)", "html": "<h3>3-1. 정보보호 3대 요소 CIA</h3>\n<table>\n<thead>\n<tr>\n<th>요소</th>\n<th>의미</th>\n<th>대표</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>기밀성 (Confidentiality)</td>\n<td>인가되지 않은 사람이 정보를 보지 못하게 함</td>\n<td>암호화, 접근통제</td>\n</tr>\n<tr>\n<td>무결성 (Integrity)</td>\n<td>정보가 위·변조되지 않았음을 보장</td>\n<td>해시, MAC, 전자서명</td>\n</tr>\n<tr>\n<td>가용성 (Availability)</td>\n<td>필요할 때 정상적으로 사용 가능</td>\n<td>(대표 공격) DoS / DDoS</td>\n</tr>\n</tbody>\n</table>\n<h3>3-2. 추가 보안 속성</h3>\n<table>\n<thead>\n<tr>\n<th>속성</th>\n<th>한 줄</th>\n<th>비고</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>인증 (Authentication)</td>\n<td>\"너 누구냐?\" — 사용자 신원 확인</td>\n<td></td>\n</tr>\n<tr>\n<td>인가 (Authorization)</td>\n<td>\"너 이거 해도 되냐?\" — 인증된 사용자의 권한 확인</td>\n<td>인증 다음 단계</td>\n</tr>\n<tr>\n<td>부인방지 (Non-repudiation)</td>\n<td>\"나 안 보냈다\"고 부인하지 못하게 함</td>\n<td>대표: <strong>전자서명</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>3-3. 위협 · 취약점 · 위험</h3>\n<ul>\n<li><strong>위협(Threat)</strong>: 사고를 일으킬 가능성이 있는 원인</li>\n<li><strong>취약점(Vulnerability)</strong>: 공격에 악용될 수 있는 약점</li>\n<li><strong>위험(Risk)</strong>: 위협이 취약점을 이용하여 실제 손실이 발생할 가능성</li>\n</ul>\n<pre><code>위협 → 취약점 이용 → 위험 발생\n</code></pre>"}, {"id": "sec2", "subject": "sec", "subjectName": "정보보안", "title": "암호 · 해시 · MAC · 서명", "html": "<h3>3-4. 암호화 핵심</h3>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>대칭키</th>\n<th>공개키(비대칭키)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>키</td>\n<td>같은 키로 암·복호화</td>\n<td>공개키 + 개인키</td>\n</tr>\n<tr>\n<td>장점</td>\n<td><strong>빠름</strong></td>\n<td>키 관리·분배 용이, <strong>전자서명 가능</strong></td>\n</tr>\n<tr>\n<td>단점</td>\n<td><strong>키 배송 문제</strong></td>\n<td>느림</td>\n</tr>\n<tr>\n<td>대표</td>\n<td>AES, DES, 3DES, SEED, ARIA</td>\n<td>RSA, ECC, ElGamal</td>\n</tr>\n</tbody>\n</table>\n<p><strong>RSA 방향 (최다 함정)</strong></p>\n<ul>\n<li><strong>기밀성</strong>: 송신자가 <strong>수신자의 공개키</strong>로 암호화 → 수신자가 <strong>수신자의 개인키</strong>로 복호화</li>\n<li><strong>전자서명</strong>: 송신자가 <strong>송신자의 개인키</strong>로 서명 → 수신자가 <strong>송신자의 공개키</strong>로 검증</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 720 320\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK KR\">\n<rect x=\"10\" y=\"10\" width=\"700\" height=\"140\" rx=\"10\" fill=\"#eff6ff\" stroke=\"#2563eb\"/>\n<text x=\"26\" y=\"36\" font-size=\"14\" font-weight=\"bold\" fill=\"#1e3a8a\">① 기밀성 — 키 주인은 \"수신자\"</text>\n<rect x=\"40\" y=\"60\" width=\"90\" height=\"42\" rx=\"8\" fill=\"#fff\" stroke=\"#6b7280\"/><text x=\"85\" y=\"86\" font-size=\"13\" text-anchor=\"middle\">송신자</text>\n<line x1=\"130\" y1=\"81\" x2=\"230\" y2=\"81\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M 230 81 l -9 -5 v 10 z\" fill=\"#2563eb\"/>\n<rect x=\"140\" y=\"50\" width=\"120\" height=\"24\" rx=\"12\" fill=\"#dbeafe\" stroke=\"#2563eb\"/><text x=\"200\" y=\"66\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1e3a8a\" font-weight=\"bold\">수신자의 공개키</text><text x=\"180\" y=\"100\" font-size=\"11\" fill=\"#1e3a8a\">암호화</text>\n<rect x=\"236\" y=\"60\" width=\"100\" height=\"42\" rx=\"8\" fill=\"#1e3a8a\"/><text x=\"286\" y=\"86\" font-size=\"13\" text-anchor=\"middle\" fill=\"#fff\">암호문</text>\n<line x1=\"336\" y1=\"81\" x2=\"446\" y2=\"81\" stroke=\"#2563eb\" stroke-width=\"2\"/><path d=\"M 446 81 l -9 -5 v 10 z\" fill=\"#2563eb\"/>\n<rect x=\"342\" y=\"50\" width=\"120\" height=\"24\" rx=\"12\" fill=\"#dbeafe\" stroke=\"#2563eb\"/><text x=\"402\" y=\"66\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1e3a8a\" font-weight=\"bold\">수신자의 개인키</text><text x=\"386\" y=\"100\" font-size=\"11\" fill=\"#1e3a8a\">복호화</text>\n<rect x=\"452\" y=\"60\" width=\"90\" height=\"42\" rx=\"8\" fill=\"#fff\" stroke=\"#6b7280\"/><text x=\"497\" y=\"86\" font-size=\"13\" text-anchor=\"middle\">수신자</text>\n<text x=\"556\" y=\"76\" font-size=\"11.5\" fill=\"#1e3a8a\">개인키는 수신자만 가짐</text><text x=\"556\" y=\"94\" font-size=\"11.5\" fill=\"#1e3a8a\">→ 수신자만 열 수 있다</text>\n<text x=\"40\" y=\"134\" font-size=\"12\" fill=\"#374151\">암호화할 때 송신자가 쓰는 키 = 항상 상대방(수신자)의 공개키</text>\n<rect x=\"10\" y=\"164\" width=\"700\" height=\"140\" rx=\"10\" fill=\"#fdf2f8\" stroke=\"#db2777\"/>\n<text x=\"26\" y=\"190\" font-size=\"14\" font-weight=\"bold\" fill=\"#831843\">② 전자서명 — 키 주인은 \"송신자\"</text>\n<rect x=\"40\" y=\"214\" width=\"90\" height=\"42\" rx=\"8\" fill=\"#fff\" stroke=\"#6b7280\"/><text x=\"85\" y=\"240\" font-size=\"13\" text-anchor=\"middle\">송신자</text>\n<line x1=\"130\" y1=\"235\" x2=\"230\" y2=\"235\" stroke=\"#db2777\" stroke-width=\"2\"/><path d=\"M 230 235 l -9 -5 v 10 z\" fill=\"#db2777\"/>\n<rect x=\"140\" y=\"204\" width=\"120\" height=\"24\" rx=\"12\" fill=\"#fce7f3\" stroke=\"#db2777\"/><text x=\"200\" y=\"220\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#831843\" font-weight=\"bold\">송신자의 개인키</text><text x=\"184\" y=\"254\" font-size=\"11\" fill=\"#831843\">서명</text>\n<rect x=\"236\" y=\"214\" width=\"100\" height=\"42\" rx=\"8\" fill=\"#831843\"/><text x=\"286\" y=\"240\" font-size=\"13\" text-anchor=\"middle\" fill=\"#fff\">전자서명</text>\n<line x1=\"336\" y1=\"235\" x2=\"446\" y2=\"235\" stroke=\"#db2777\" stroke-width=\"2\"/><path d=\"M 446 235 l -9 -5 v 10 z\" fill=\"#db2777\"/>\n<rect x=\"342\" y=\"204\" width=\"120\" height=\"24\" rx=\"12\" fill=\"#fce7f3\" stroke=\"#db2777\"/><text x=\"402\" y=\"220\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#831843\" font-weight=\"bold\">송신자의 공개키</text><text x=\"386\" y=\"254\" font-size=\"11\" fill=\"#831843\">검증</text>\n<rect x=\"452\" y=\"214\" width=\"90\" height=\"42\" rx=\"8\" fill=\"#fff\" stroke=\"#6b7280\"/><text x=\"497\" y=\"240\" font-size=\"13\" text-anchor=\"middle\">수신자</text>\n<text x=\"556\" y=\"230\" font-size=\"11.5\" fill=\"#831843\">개인키는 송신자만 가짐</text><text x=\"556\" y=\"248\" font-size=\"11.5\" fill=\"#831843\">→ 송신자만 만든다 = 부인방지</text>\n<text x=\"40\" y=\"288\" font-size=\"12\" fill=\"#374151\">서명 = 개인키, 검증 = 공개키 · 선지는 주어(송신자/수신자)만 바꿔치기한다</text>\n</svg>\n</div>\n<p>판정 요령: 선지는 <strong>주어(송신자/수신자)만 바꿔치기</strong>한다. 암호화=상대방 공개키, 서명=내 개인키.</p>\n<h3>3-5. 해시 함수</h3>\n<ul>\n<li>입력 길이와 상관없이 <strong>고정 길이</strong> 해시값 생성</li>\n<li>특징: <strong>일방향성, 역상 저항성, 제2역상 저항성, 충돌 저항성</strong></li>\n<li>대표: SHA-2, SHA-3</li>\n</ul>\n<p><strong>해시만 사용했을 때의 한계</strong>: 무결성 확인은 가능하지만, 공격자가 <strong>본문과 해시를 같이 바꿀 수 있음</strong> → 송신자 인증까지 하려면 <strong>MAC</strong> 또는 <strong>전자서명</strong> 필요.</p>\n<h3>3-6. MAC — Message Authentication Code</h3>\n<blockquote>\n<p>[함정] 여기의 MAC은 <strong>Mandatory Access Control이 아님</strong> (3-14와 약어 충돌 주의!)</p>\n</blockquote>\n<ul>\n<li>MAC = <strong>메시지 + 비밀키</strong>로 인증값 생성</li>\n<li>보장: <strong>무결성 + 메시지 인증</strong></li>\n<li>그러나 송신자·수신자가 <strong>같은 비밀키를 공유</strong>하므로 → <strong>부인방지 불가</strong></li>\n<li><strong>HMAC</strong> = 해시 함수 + 비밀키</li>\n</ul>\n<pre><code>메시지 + 공유 비밀키 → HMAC → MAC 값\n</code></pre>\n<ul>\n<li>송신자는 [본문 + MAC 값]을 보내고, 수신자는 같은 비밀키로 다시 MAC을 만들어 비교</li>\n</ul>\n<p><strong>핵심: MAC은 본문을 암호화하는 것이 아니다.</strong> (본문은 평문 그대로 갈 수 있음)</p>\n<h3>3-7. 전자서명</h3>\n<pre><code>메시지 → (해시) → 해시값 → (송신자의 개인키) → 전자서명\n</code></pre>\n<ul>\n<li>송신: [원문 + 전자서명]</li>\n<li>수신: ① 원문을 해시 → ② 송신자 <strong>공개키</strong>로 서명 검증 → ③ 두 해시값 비교</li>\n<li>보장: <strong>무결성 + 송신자 인증 + 부인방지</strong></li>\n</ul>\n<p><strong>암기: 서명 = 개인키, 검증 = 공개키</strong></p>\n<h3>3-8. MAC vs 전자서명</h3>\n<table>\n<thead>\n<tr>\n<th>구분</th>\n<th>MAC</th>\n<th>전자서명</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>키</td>\n<td>공유 비밀키</td>\n<td>개인키/공개키</td>\n</tr>\n<tr>\n<td>무결성</td>\n<td>O</td>\n<td>O</td>\n</tr>\n<tr>\n<td>송신자 인증</td>\n<td>O</td>\n<td>O</td>\n</tr>\n<tr>\n<td><strong>부인방지</strong></td>\n<td><strong>X</strong></td>\n<td><strong>O</strong></td>\n</tr>\n<tr>\n<td>속도</td>\n<td>빠름</td>\n<td>상대적으로 느림</td>\n</tr>\n</tbody>\n</table>\n<div class=\"fig\"><svg viewBox=\"0 0 720 290\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK KR\">\n<text x=\"20\" y=\"26\" font-size=\"14\" font-weight=\"bold\">해시 → MAC → 전자서명 : 보장 범위가 한 칸씩 넓어지는 사다리</text>\n<rect x=\"30\" y=\"165\" width=\"200\" height=\"96\" rx=\"10\" fill=\"#f1f5f9\" stroke=\"#64748b\" stroke-width=\"1.5\"/>\n<g text-anchor=\"middle\"><text x=\"130\" y=\"191\" font-size=\"14\" font-weight=\"bold\" fill=\"#334155\">해시</text><text x=\"130\" y=\"211\" font-size=\"11.5\" fill=\"#334155\">키 없음</text>\n<text x=\"130\" y=\"231\" font-size=\"12\" font-weight=\"bold\">무결성</text><text x=\"130\" y=\"249\" font-size=\"10.5\" fill=\"#dc2626\">본문+해시 통째 교체 가능 → 인증 X</text></g>\n<rect x=\"260\" y=\"105\" width=\"200\" height=\"156\" rx=\"10\" fill=\"#fef9c3\" stroke=\"#ca8a04\" stroke-width=\"1.5\"/>\n<g text-anchor=\"middle\" fill=\"#713f12\"><text x=\"360\" y=\"131\" font-size=\"14\" font-weight=\"bold\">MAC (HMAC)</text><text x=\"360\" y=\"151\" font-size=\"11.5\">공유 비밀키 (대칭)</text>\n<text x=\"360\" y=\"175\" font-size=\"12\" font-weight=\"bold\" fill=\"#0f172a\">무결성 + 메시지 인증</text><text x=\"360\" y=\"197\" font-size=\"10.5\">메시지 + 비밀키 → MAC 값</text>\n<text x=\"360\" y=\"215\" font-size=\"10.5\">본문 암호화 아님 (평문 전송 가능)</text><text x=\"360\" y=\"241\" font-size=\"10.5\" fill=\"#dc2626\">키를 둘이 공유 → 부인방지 X</text></g>\n<rect x=\"490\" y=\"45\" width=\"200\" height=\"216\" rx=\"10\" fill=\"#dcfce7\" stroke=\"#16a34a\" stroke-width=\"1.5\"/>\n<g text-anchor=\"middle\" fill=\"#14532d\"><text x=\"590\" y=\"71\" font-size=\"14\" font-weight=\"bold\">전자서명</text><text x=\"590\" y=\"91\" font-size=\"11.5\">개인키 서명 / 공개키 검증</text>\n<text x=\"590\" y=\"117\" font-size=\"12\" font-weight=\"bold\" fill=\"#0f172a\">무결성 + 인증 + 부인방지</text><text x=\"590\" y=\"143\" font-size=\"10.5\">메시지 → 해시 → 개인키로 서명</text>\n<text x=\"590\" y=\"161\" font-size=\"10.5\">수신: 원문 해시 vs 검증 해시 비교</text><text x=\"590\" y=\"187\" font-size=\"10.5\" fill=\"#16a34a\">개인키는 송신자만 가짐</text>\n<text x=\"590\" y=\"205\" font-size=\"10.5\" fill=\"#16a34a\">→ \"내가 안 만들었다\" 불가</text><text x=\"590\" y=\"235\" font-size=\"10.5\" fill=\"#713f12\">단점: MAC보다 느림</text></g>\n<line x1=\"230\" y1=\"145\" x2=\"258\" y2=\"145\" stroke=\"#374151\" stroke-width=\"2\"/><path d=\"M 258 145 l -9 -5 v 10 z\" fill=\"#374151\"/><text x=\"244\" y=\"135\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\">+인증</text>\n<line x1=\"460\" y1=\"85\" x2=\"488\" y2=\"85\" stroke=\"#374151\" stroke-width=\"2\"/><path d=\"M 488 85 l -9 -5 v 10 z\" fill=\"#374151\"/><text x=\"474\" y=\"75\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\">+부인방지</text>\n<text x=\"30\" y=\"282\" font-size=\"12\" fill=\"#374151\">부인방지가 필요한가? → Yes면 무조건 전자서명. MAC의 X는 항상 부인방지 자리.</text>\n</svg>\n</div>\n<blockquote>\n<p>[함정] \"MAC은 부인방지를 제공한다\" → X (키를 둘이 공유하니, 수신자도 같은 MAC을 만들 수 있음 → 법적으로 \"네가 만들었잖아\" 반박 가능). 부인방지가 필요하면 무조건 전자서명.</p>\n</blockquote>"}, {"id": "sec3", "subject": "sec", "subjectName": "정보보안", "title": "인증 (PKI · MFA · SSO · Kerberos)", "html": "<h3>3-9. 인증서 · CA · PKI</h3>\n<ul>\n<li><strong>인증서</strong>: <strong>공개키가 누구의 것인지</strong> 증명. 주요 내용 = 사용자 정보, 공개키, 발급자, 유효기간, <strong>CA의 전자서명</strong></li>\n<li><strong>CA</strong> (Certification Authority): 인증서 발급·검증 기관</li>\n<li><strong>PKI</strong> (Public Key Infrastructure): 공개키를 안전하게 관리하기 위한 전체 체계</li>\n</ul>\n<h3>3-10. 사용자 인증 3요소</h3>\n<table>\n<thead>\n<tr>\n<th>유형</th>\n<th>한 줄</th>\n<th>예</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>지식 기반</td>\n<td>내가 <strong>아는</strong> 것</td>\n<td>비밀번호, PIN</td>\n</tr>\n<tr>\n<td>소유 기반</td>\n<td>내가 <strong>가진</strong> 것</td>\n<td>OTP, 스마트카드, 보안토큰</td>\n</tr>\n<tr>\n<td>생체 기반</td>\n<td>내 <strong>신체적 특징</strong></td>\n<td>지문, 홍채, 얼굴</td>\n</tr>\n</tbody>\n</table>\n<p><strong>MFA</strong>: 서로 <strong>다른</strong> 인증 요소를 2개 이상 사용. 예) 비밀번호 + OTP</p>\n<blockquote>\n<p>[함정] 비밀번호 + PIN = 둘 다 지식 기반 → <strong>MFA 아님</strong></p>\n</blockquote>\n<h3>3-11. SSO (Single Sign-On)</h3>\n<ul>\n<li>한 번 인증하면 여러 시스템 사용</li>\n<li>장점: 편리, 비밀번호 관리 감소</li>\n<li>단점: <strong>SSO 인증이 뚫리면 여러 시스템에 연쇄 영향</strong></li>\n</ul>\n<h3>3-12. Kerberos</h3>\n<ul>\n<li><strong>대칭키 기반</strong> 네트워크 인증 프로토콜</li>\n<li>핵심: <strong>티켓</strong> 사용, <strong>KDC</strong>(Key Distribution Center), <strong>비밀번호를 네트워크에 직접 전송하지 않음</strong></li>\n<li>KDC 구성 = <strong>AS</strong>(Authentication Server) + <strong>TGS</strong>(Ticket Granting Server)</li>\n</ul>\n<pre><code>로그인 → TGT 발급(AS) → 서비스 티켓 발급(TGS) → 서버 접근\n</code></pre>\n<blockquote>\n<p>[함정] \"커버로스는 공개키 기반이다\" → X (대칭키). 타임스탬프로 재전송 공격 방지도 세트로 출제.</p>\n</blockquote>"}, {"id": "sec4", "subject": "sec", "subjectName": "정보보안", "title": "접근통제 (DAC/MAC/RBAC · BLP · Biba)", "html": "<h3>3-13. 접근통제 기본 흐름</h3>\n<pre><code>식별(Identification) → 인증(Authentication) → 인가(Authorization) → 책임추적(Accountability)\n</code></pre>\n<h3>3-14. DAC · MAC · RBAC</h3>\n<blockquote>\n<p>[함정] 여기의 MAC은 <strong>Mandatory Access Control</strong> (3-6의 메시지 인증 코드와 약어만 같음)</p>\n</blockquote>\n<p><strong>DAC — 임의적 접근통제 (Discretionary)</strong></p>\n<ul>\n<li><strong>객체 소유자</strong>가 권한을 결정. 예) Linux 파일 소유자가 <code>chmod</code>로 권한 설정</li>\n<li>특징: 유연, 사용자 중심, 권한 전파 가능, 보안은 MAC보다 약함</li>\n<li>키워드: <strong>소유자</strong></li>\n</ul>\n<p><strong>MAC — 강제적 접근통제 (Mandatory)</strong></p>\n<ul>\n<li><strong>중앙 정책 / 보안 등급</strong>에 의해 권한 결정. 사용자가 마음대로 권한 변경 불가</li>\n<li>예: Top Secret &gt; Secret &gt; Confidential</li>\n<li>키워드: <strong>보안등급 / 중앙통제</strong></li>\n<li>대표 모델: <strong>Bell-LaPadula, Biba</strong></li>\n</ul>\n<p><strong>RBAC — 역할 기반 접근통제 (Role-Based)</strong></p>\n<ul>\n<li>사용자에게 직접 권한을 주는 것이 아니라 <strong>역할(Role)에 권한 부여</strong></li>\n<li>예: 김철수 → 회계담당자 Role → 결제 조회/승인 권한</li>\n<li>장점: 조직 권한 관리 편리, <strong>직무 변경 시 Role만 변경</strong></li>\n<li>키워드: <strong>역할 / 직무</strong></li>\n</ul>\n<p><strong>한 줄: DAC = 소유자, MAC = 보안등급, RBAC = 역할</strong></p>\n<h3>3-15. Bell-LaPadula</h3>\n<ul>\n<li>목적: <strong>기밀성(Confidentiality)</strong></li>\n<li><strong>No Read Up</strong>: 자신보다 높은 등급의 정보 읽기 금지 (상위 읽기 금지)</li>\n<li><strong>No Write Down</strong>: 자신보다 낮은 등급으로 쓰기 금지 (하위 쓰기 금지)</li>\n<li>이유: 높은 기밀 정보가 낮은 등급으로 <strong>유출</strong>되는 것을 막기 위해</li>\n</ul>\n<p><strong>암기: 벨라 = 기밀성, NRU / NWD</strong></p>\n<h3>3-16. Biba</h3>\n<ul>\n<li>목적: <strong>무결성(Integrity)</strong> — Bell-LaPadula와 <strong>반대 방향</strong></li>\n<li><strong>No Read Down</strong>: 낮은 무결성의 정보 읽기 금지 (하위 읽기 금지)</li>\n<li><strong>No Write Up</strong>: 높은 무결성 객체에 쓰기 금지 (상위 쓰기 금지)</li>\n</ul>\n<p><strong>암기: 비바 = 무결성, NRD / NWU</strong></p>\n<h3>3-17. Bell-LaPadula vs Biba</h3>\n<table>\n<thead>\n<tr>\n<th>모델</th>\n<th>목적</th>\n<th>읽기</th>\n<th>쓰기</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Bell-LaPadula</td>\n<td><strong>기밀성</strong></td>\n<td>No Read <strong>Up</strong></td>\n<td>No Write <strong>Down</strong></td>\n</tr>\n<tr>\n<td>Biba</td>\n<td><strong>무결성</strong></td>\n<td>No Read <strong>Down</strong></td>\n<td>No Write <strong>Up</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>초압축: 벨라 \"위 읽지마, 아래 쓰지마\" / 비바 \"아래 읽지마, 위 쓰지마\"</strong></p>\n<div class=\"fig\"><svg viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK KR\">\n<rect x=\"15\" y=\"15\" width=\"335\" height=\"330\" rx=\"10\" fill=\"#eff6ff\" stroke=\"#2563eb\"/>\n<text x=\"182\" y=\"44\" font-size=\"15\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#1e3a8a\">Bell-LaPadula = 기밀성</text>\n<text x=\"182\" y=\"63\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1e3a8a\">\"비밀이 아래로 새면 안 된다\"</text>\n<rect x=\"95\" y=\"80\" width=\"175\" height=\"36\" rx=\"6\" fill=\"#bfdbfe\" stroke=\"#2563eb\"/><text x=\"182\" y=\"103\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1e3a8a\" font-weight=\"bold\">상위 등급</text>\n<rect x=\"95\" y=\"170\" width=\"175\" height=\"36\" rx=\"6\" fill=\"#fff\" stroke=\"#6b7280\"/><text x=\"182\" y=\"193\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"bold\">주체 (나)</text>\n<rect x=\"95\" y=\"260\" width=\"175\" height=\"36\" rx=\"6\" fill=\"#e5e7eb\" stroke=\"#6b7280\"/><text x=\"182\" y=\"283\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#374151\" font-weight=\"bold\">하위 등급</text>\n<g stroke=\"#dc2626\"><line x1=\"135\" y1=\"168\" x2=\"135\" y2=\"120\" stroke-width=\"2.5\"/><line x1=\"123\" y1=\"150\" x2=\"147\" y2=\"134\" stroke-width=\"3\"/><line x1=\"123\" y1=\"134\" x2=\"147\" y2=\"150\" stroke-width=\"3\"/>\n<line x1=\"230\" y1=\"208\" x2=\"230\" y2=\"256\" stroke-width=\"2.5\"/><line x1=\"218\" y1=\"240\" x2=\"242\" y2=\"224\" stroke-width=\"3\"/><line x1=\"218\" y1=\"224\" x2=\"242\" y2=\"240\" stroke-width=\"3\"/></g>\n<path d=\"M 135 120 l -6 10 h 12 z\" fill=\"#dc2626\"/><path d=\"M 230 256 l -6 -10 h 12 z\" fill=\"#dc2626\"/>\n<g fill=\"#dc2626\"><text x=\"45\" y=\"146\" font-size=\"11.5\" font-weight=\"bold\">읽기 금지</text><text x=\"38\" y=\"161\" font-size=\"10.5\">No Read Up</text>\n<text x=\"252\" y=\"228\" font-size=\"11.5\" font-weight=\"bold\">쓰기 금지</text><text x=\"252\" y=\"243\" font-size=\"10.5\">No Write Down (★)</text></g>\n<text x=\"182\" y=\"325\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1e3a8a\">허용: 아래 읽기 O · 위로 쓰기 O</text>\n<rect x=\"370\" y=\"15\" width=\"335\" height=\"330\" rx=\"10\" fill=\"#f0fdf4\" stroke=\"#16a34a\"/>\n<text x=\"537\" y=\"44\" font-size=\"15\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#14532d\">Biba = 무결성 (BLP 거울상)</text>\n<text x=\"537\" y=\"63\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#14532d\">\"오염된 게 위로 올라오면 안 된다\"</text>\n<rect x=\"450\" y=\"80\" width=\"175\" height=\"36\" rx=\"6\" fill=\"#bbf7d0\" stroke=\"#16a34a\"/><text x=\"537\" y=\"103\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#14532d\" font-weight=\"bold\">높은 무결성</text>\n<rect x=\"450\" y=\"170\" width=\"175\" height=\"36\" rx=\"6\" fill=\"#fff\" stroke=\"#6b7280\"/><text x=\"537\" y=\"193\" font-size=\"12.5\" text-anchor=\"middle\" font-weight=\"bold\">주체 (나)</text>\n<rect x=\"450\" y=\"260\" width=\"175\" height=\"36\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#dc2626\"/><text x=\"537\" y=\"283\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#991b1b\" font-weight=\"bold\">낮은 무결성 (오염 가능)</text>\n<g stroke=\"#dc2626\"><line x1=\"490\" y1=\"168\" x2=\"490\" y2=\"120\" stroke-width=\"2.5\"/><line x1=\"478\" y1=\"150\" x2=\"502\" y2=\"134\" stroke-width=\"3\"/><line x1=\"478\" y1=\"134\" x2=\"502\" y2=\"150\" stroke-width=\"3\"/>\n<line x1=\"585\" y1=\"208\" x2=\"585\" y2=\"256\" stroke-width=\"2.5\"/><line x1=\"573\" y1=\"240\" x2=\"597\" y2=\"224\" stroke-width=\"3\"/><line x1=\"573\" y1=\"224\" x2=\"597\" y2=\"240\" stroke-width=\"3\"/></g>\n<path d=\"M 490 120 l -6 10 h 12 z\" fill=\"#dc2626\"/><path d=\"M 585 256 l -6 -10 h 12 z\" fill=\"#dc2626\"/>\n<g fill=\"#dc2626\"><text x=\"400\" y=\"146\" font-size=\"11.5\" font-weight=\"bold\">쓰기 금지</text><text x=\"394\" y=\"161\" font-size=\"10.5\">No Write Up</text>\n<text x=\"607\" y=\"228\" font-size=\"11.5\" font-weight=\"bold\">읽기 금지</text><text x=\"607\" y=\"243\" font-size=\"10.5\">No Read Down</text></g>\n<text x=\"537\" y=\"325\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#14532d\">허용: 위 읽기 O · 아래로 쓰기 O</text>\n<rect x=\"15\" y=\"358\" width=\"690\" height=\"34\" rx=\"8\" fill=\"#fff7ed\" stroke=\"#ea580c\"/>\n<text x=\"360\" y=\"380\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#7c2d12\" font-weight=\"bold\">기밀성은 \"아래로 새는 것\"이 문제 → Down 금지 / 무결성은 \"위가 오염되는 것\"이 문제 → Up 금지</text>\n</svg>\n</div>\n<blockquote>\n<p>[함정] 시험장 복원 한 줄: <strong>기밀성은 아래로 새는 게 문제(Down 금지), 무결성은 위가 오염되는 게 문제(Up 금지)</strong></p>\n</blockquote>\n<h3>3-18. Clark-Wilson</h3>\n<ul>\n<li>목적: <strong>상업적 시스템의 무결성</strong></li>\n<li>핵심: <strong>잘 형성된 트랜잭션(Well-Formed Transaction)</strong> + <strong>직무 분리(Separation of Duties)</strong></li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>구분</th>\n<th>약어</th>\n<th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>데이터</td>\n<td><strong>CDI</strong></td>\n<td>보호해야 하는 핵심 데이터</td>\n</tr>\n<tr>\n<td>데이터</td>\n<td><strong>UDI</strong></td>\n<td>검증되지 않은 외부 데이터</td>\n</tr>\n<tr>\n<td>프로그램</td>\n<td><strong>TP</strong></td>\n<td>데이터 변환 프로그램</td>\n</tr>\n<tr>\n<td>프로그램</td>\n<td><strong>IVP</strong></td>\n<td>무결성 검증 프로그램</td>\n</tr>\n</tbody>\n</table>\n<p>핵심: 사용자가 중요 데이터를 직접 수정하지 않고 <strong>허가된 프로그램(TP)을 통해서만 변경</strong> (주체 → TP → CDI)</p>\n<ul>\n<li>예: 은행 직원이 DB에서 잔액을 직접 UPDATE (X) / 승인된 입출금 프로그램을 통해 변경 (O)</li>\n</ul>\n<p><strong>암기: Clark-Wilson = 상업적 무결성 + 직무분리 + 잘 형성된 트랜잭션</strong></p>\n<h3>3-19. 보안 모델 최종 비교</h3>\n<table>\n<thead>\n<tr>\n<th>모델</th>\n<th>목표</th>\n<th>핵심</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Bell-LaPadula</td>\n<td>기밀성</td>\n<td>No Read Up / No Write Down</td>\n</tr>\n<tr>\n<td>Biba</td>\n<td>무결성</td>\n<td>No Read Down / No Write Up</td>\n</tr>\n<tr>\n<td>Clark-Wilson</td>\n<td>상업적 무결성</td>\n<td>TP + 직무 분리</td>\n</tr>\n</tbody>\n</table>"}, {"id": "os1", "subject": "os", "subjectName": "운영체제", "title": "디스크 스케줄링", "html": "<p><strong>한 칼 구분: \"가까운 것부터\"면 SSTF, \"한 방향으로 쓸고 가면\" SCAN 계열. C-가 붙으면 돌아올 때 서비스 없이 점프.</strong></p>\n<table>\n<thead>\n<tr>\n<th>알고리즘</th>\n<th>개념</th>\n<th>특징 · 함정</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>FCFS</strong></td>\n<td>요청 <strong>도착 순서</strong> 그대로</td>\n<td>공평, 이동거리 큼</td>\n</tr>\n<tr>\n<td><strong>SSTF</strong></td>\n<td>현재 헤드에서 <strong>가장 가까운</strong> 요청부터</td>\n<td>평균 탐색시간 짧음, 먼 요청 <strong>기아</strong> 가능</td>\n</tr>\n<tr>\n<td><strong>SCAN</strong> (엘리베이터)</td>\n<td>한 방향으로 <strong>끝(0 또는 최대 트랙)까지</strong> 가며 처리 → 반대로 돌아오며 처리</td>\n<td>끝까지 찍고 돈다</td>\n</tr>\n<tr>\n<td><strong>C-SCAN</strong></td>\n<td>한 방향으로 끝까지 처리 → <strong>반대쪽 끝으로 점프</strong>(서비스 없음) → 같은 방향으로 다시 처리</td>\n<td>대기시간 균일. 방향이 0쪽이면 <strong>큰 번호부터 내려오며</strong> 이어감</td>\n</tr>\n<tr>\n<td><strong>LOOK</strong></td>\n<td>SCAN인데 끝까지 안 가고 <strong>마지막 요청에서 방향 전환</strong></td>\n<td></td>\n</tr>\n<tr>\n<td><strong>C-LOOK</strong></td>\n<td>C-SCAN인데 <strong>마지막 요청에서 반대편 첫 요청으로 점프</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>풀이 시작점</strong>: ① 큐를 오름차순 정렬해서 수직선에 찍고 헤드 위치 표시 → ② 방향 확인 → ③ 구간 거리 더하기.</p>\n<p><strong>대표 예제 (2022 국가직 #20, SSTF)</strong> — 헤드 50, 범위 0~150, 큐: 80, 20, 100, 30, 70, 130, 40 → 총 이동거리?</p>\n<pre><code>정렬: 20  30  40  [50]  70  80  100  130\n50 → 40 (10) → 30 (10) → 20 (10) → 70 (50) → 80 (10) → 100 (20) → 130 (30)\n합계 = 10+10+10+50+10+20+30 = 140\n</code></pre>\n<p>→ <strong>정답 140</strong>. 20까지 내려간 뒤 가장 가까운 건 70(거리 50). 매 단계 \"현재 위치 기준\"으로 다시 가장 가까운 것을 고른다.</p>\n<blockquote>\n<p>⚠️ 함정: SSTF는 <strong>처음 위치 기준이 아니라 매번 현재 위치 기준</strong>. SCAN은 끝(0/최대)까지 가는 거리 포함, LOOK은 마지막 요청까지만.</p>\n</blockquote>"}, {"id": "os2", "subject": "os", "subjectName": "운영체제", "title": "페이지 교체", "html": "<p><strong>한 칼 구분: FIFO = 들어온 순서, LRU = 마지막 사용 시점, LFU = 사용 횟수, OPT = 미래. 셋 다 \"가장 ~한 것을 내보낸다\".</strong></p>\n<table>\n<thead>\n<tr>\n<th>알고리즘</th>\n<th>내보내는 페이지</th>\n<th>특징 · 함정</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>FIFO</strong></td>\n<td><strong>가장 먼저 들어온</strong> 페이지</td>\n<td>구현 쉬움, hit 돼도 순서 안 바뀜. <strong>벨레이디 모순</strong>(프레임 늘려도 부재 증가 가능)</td>\n</tr>\n<tr>\n<td><strong>OPT</strong> (최적)</td>\n<td><strong>앞으로 가장 오랫동안 안 쓸</strong> 페이지</td>\n<td>부재 최소, 미래를 알아야 해서 <strong>구현 불가</strong>(비교 기준용)</td>\n</tr>\n<tr>\n<td><strong>LRU</strong></td>\n<td><strong>가장 오랫동안 사용 안 된</strong> 페이지</td>\n<td><strong>hit 때도 \"최근 사용\"으로 갱신</strong>. 과거 기준 OPT 근사</td>\n</tr>\n<tr>\n<td><strong>LFU</strong></td>\n<td><strong>사용 횟수가 가장 적은</strong> 페이지</td>\n<td>동률이면 문제 조건(보통 오래된 것)</td>\n</tr>\n<tr>\n<td><strong>MFU</strong></td>\n<td><strong>사용 횟수가 가장 많은</strong> 페이지</td>\n<td>\"많이 쓴 건 이제 끝났다\" 가정</td>\n</tr>\n<tr>\n<td><strong>NUR / 2차 기회(Clock)</strong></td>\n<td>참조 비트(·변형 비트) 0인 페이지</td>\n<td>참조 비트 1이면 0으로 바꾸고 한 번 더 기회</td>\n</tr>\n</tbody>\n</table>\n<p>관련 개념: 페이지 부재가 너무 잦아 실행보다 교체에 시간을 더 쓰는 현상 = <strong>스래싱(Thrashing)</strong>.</p>\n<p><strong>풀이 시작점</strong>: 참조열을 가로로 쓰고, 아래에 프레임 칸을 그려 매 참조마다 상태를 적은 뒤 부재(F)에 표시. <strong>처음 빈 프레임이 채워지는 것도 부재로 센다.</strong></p>\n<p><strong>대표 예제 (2022 국회직 #3)</strong> — 프레임 3개, 참조열 3, 1, 2, 4, 1, 4, 3, 2, 1, 2, 3 → LRU / FIFO 부재 횟수?</p>\n<p><strong>LRU</strong> (프레임 안쪽 순서 = 오래 안 쓴 것 → 최근 쓴 것)</p>\n<table>\n<thead>\n<tr>\n<th>참조</th>\n<th>3</th>\n<th>1</th>\n<th>2</th>\n<th>4</th>\n<th>1</th>\n<th>4</th>\n<th>3</th>\n<th>2</th>\n<th>1</th>\n<th>2</th>\n<th>3</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>프레임</td>\n<td>3</td>\n<td>3 1</td>\n<td>3 1 2</td>\n<td>1 2 4</td>\n<td>2 4 1</td>\n<td>2 1 4</td>\n<td>1 4 3</td>\n<td>4 3 2</td>\n<td>3 2 1</td>\n<td>3 1 2</td>\n<td>1 2 3</td>\n</tr>\n<tr>\n<td>부재</td>\n<td>F</td>\n<td>F</td>\n<td>F</td>\n<td>F</td>\n<td></td>\n<td></td>\n<td>F</td>\n<td>F</td>\n<td>F</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>FIFO</strong> (프레임 안쪽 순서 = 먼저 들어온 것 → 나중)</p>\n<table>\n<thead>\n<tr>\n<th>참조</th>\n<th>3</th>\n<th>1</th>\n<th>2</th>\n<th>4</th>\n<th>1</th>\n<th>4</th>\n<th>3</th>\n<th>2</th>\n<th>1</th>\n<th>2</th>\n<th>3</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>프레임</td>\n<td>3</td>\n<td>3 1</td>\n<td>3 1 2</td>\n<td>1 2 4</td>\n<td>1 2 4</td>\n<td>1 2 4</td>\n<td>2 4 3</td>\n<td>2 4 3</td>\n<td>4 3 1</td>\n<td>3 1 2</td>\n<td>3 1 2</td>\n</tr>\n<tr>\n<td>부재</td>\n<td>F</td>\n<td>F</td>\n<td>F</td>\n<td>F</td>\n<td></td>\n<td></td>\n<td>F</td>\n<td></td>\n<td>F</td>\n<td>F</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>→ <strong>LRU 7번 / FIFO 7번</strong>. 차이 포인트: 5번째 참조(1) hit 때 <strong>LRU는 1을 맨 뒤(최근)로 옮기고, FIFO는 그대로 둔다</strong> → 7번째 참조(3)에서 내보내는 페이지가 갈림(LRU는 2, FIFO는 1).</p>\n<blockquote>\n<p>⚠️ 함정: LRU에서 hit를 그냥 넘기면 FIFO랑 똑같이 풀게 된다. <strong>hit 나면 반드시 순서 갱신.</strong></p>\n</blockquote>"}, {"id": "os3", "subject": "os", "subjectName": "운영체제", "title": "CPU 스케줄링", "html": "<p><strong>한 칼 구분: 실행 중인 걸 뺏을 수 있으면 선점(SRT·RR·MLFQ·선점 우선순위), 못 뺏으면 비선점(FCFS·SJF·HRN·비선점 우선순위).</strong></p>\n<table>\n<thead>\n<tr>\n<th>알고리즘</th>\n<th>개념</th>\n<th>선점</th>\n<th>특징 · 함정</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>FCFS</strong></td>\n<td><strong>도착 순서</strong>대로</td>\n<td>비선점</td>\n<td>짧은 작업이 긴 작업 뒤에서 오래 기다림(호위 효과)</td>\n</tr>\n<tr>\n<td><strong>SJF</strong></td>\n<td><strong>실행시간이 가장 짧은</strong> 것부터</td>\n<td>비선점</td>\n<td>평균 대기시간 최소, 긴 작업 <strong>기아</strong></td>\n</tr>\n<tr>\n<td><strong>SRT</strong></td>\n<td><strong>남은 실행시간이 가장 짧은</strong> 것. 새 프로세스 도착할 때마다 비교</td>\n<td><strong>선점</strong></td>\n<td>SJF의 선점판. 도착 시점마다 재판정</td>\n</tr>\n<tr>\n<td><strong>RR</strong></td>\n<td><strong>시간 할당량(quantum)</strong>만큼씩 돌아가며</td>\n<td><strong>선점</strong></td>\n<td>시분할용, 기아 없음. quantum이 너무 크면 FCFS화</td>\n</tr>\n<tr>\n<td><strong>우선순위</strong></td>\n<td>우선순위 높은 것부터</td>\n<td>둘 다 가능</td>\n<td>기아 → <strong>에이징(aging)</strong>으로 해결</td>\n</tr>\n<tr>\n<td><strong>HRN</strong></td>\n<td><strong>(대기시간 + 서비스시간) ÷ 서비스시간</strong>이 큰 것부터</td>\n<td>비선점</td>\n<td>SJF의 기아 보완 (오래 기다리면 우선순위 상승)</td>\n</tr>\n<tr>\n<td><strong>MLQ / MLFQ</strong></td>\n<td>여러 큐 / 큐 사이 이동 허용</td>\n<td>선점</td>\n<td>MLFQ는 오래 쓰면 아래 큐로 강등</td>\n</tr>\n</tbody>\n</table>\n<p><strong>시간 기호 (영어 약어)</strong></p>\n<table>\n<thead>\n<tr>\n<th>약어</th>\n<th>영어</th>\n<th>한국어</th>\n<th>구하는 법</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>AT</strong></td>\n<td>Arrival Time</td>\n<td>도착 시간</td>\n<td>표에 주어짐</td>\n</tr>\n<tr>\n<td><strong>BT</strong></td>\n<td>Burst Time</td>\n<td>실행시간 (= CPU 사용시간 = 서비스 시간)</td>\n<td>표에 주어짐</td>\n</tr>\n<tr>\n<td><strong>CT</strong></td>\n<td>Completion Time</td>\n<td>종료 시각</td>\n<td>간트차트에서 읽음</td>\n</tr>\n<tr>\n<td><strong>TAT</strong></td>\n<td>Turnaround Time</td>\n<td>반환시간</td>\n<td><strong>CT − AT</strong></td>\n</tr>\n<tr>\n<td><strong>WT</strong></td>\n<td>Waiting Time</td>\n<td>대기시간</td>\n<td><strong>TAT − BT</strong></td>\n</tr>\n<tr>\n<td><strong>RT</strong></td>\n<td>Response Time</td>\n<td>응답시간</td>\n<td>처음 CPU를 받은 시각 − AT</td>\n</tr>\n<tr>\n<td><strong>TQ</strong></td>\n<td>Time Quantum</td>\n<td>시간 할당량 (RR)</td>\n<td>문제에 주어짐</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>HRN 우선순위 = <strong>(WT + BT) ÷ BT</strong>. 응답률(Response Ratio)이라고 부르는데, 약어 RR이 Round Robin과 겹치니 문맥으로 구분.</li>\n<li>비선점에서는 RT = WT (한 번 시작하면 안 끊김). 선점에서는 RT ≤ WT.</li>\n</ul>\n<p><strong>풀이 순서</strong>: AT 정렬 → 간트차트 (선점형은 <strong>도착 시각마다 멈춰서 재판정</strong>) → CT → TAT → WT. 대기 구간을 직접 세지 말고 TAT를 먼저 구한 뒤 BT를 뺀다.</p>\n<p><strong>대표 예제 — 같은 표를 SJF와 SRT로</strong></p>\n<table>\n<thead>\n<tr>\n<th>P</th>\n<th>AT</th>\n<th>BT</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>P1</td>\n<td>0</td>\n<td>6</td>\n</tr>\n<tr>\n<td>P2</td>\n<td>1</td>\n<td>4</td>\n</tr>\n<tr>\n<td>P3</td>\n<td>2</td>\n<td>1</td>\n</tr>\n<tr>\n<td>P4</td>\n<td>3</td>\n<td>2</td>\n</tr>\n</tbody>\n</table>\n<p><strong>① SJF (비선점)</strong></p>\n<pre><code>| P1 | P3 | P4 | P2 |\n0    6    7    9    13\n</code></pre>\n<p>t=0에는 P1만 와 있어서 P1이 시작하고, 비선점이라 6까지 실행한다. t=6에 남은 것 중 BT가 짧은 순서 P3(1) → P4(2) → P2(4).</p>\n<table>\n<thead>\n<tr>\n<th>P</th>\n<th>AT</th>\n<th>BT</th>\n<th>CT</th>\n<th>TAT</th>\n<th>WT</th>\n<th>RT</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>P1</td>\n<td>0</td>\n<td>6</td>\n<td>6</td>\n<td>6</td>\n<td>0</td>\n<td>0</td>\n</tr>\n<tr>\n<td>P2</td>\n<td>1</td>\n<td>4</td>\n<td>13</td>\n<td>12</td>\n<td>8</td>\n<td>8</td>\n</tr>\n<tr>\n<td>P3</td>\n<td>2</td>\n<td>1</td>\n<td>7</td>\n<td>5</td>\n<td>4</td>\n<td>4</td>\n</tr>\n<tr>\n<td>P4</td>\n<td>3</td>\n<td>2</td>\n<td>9</td>\n<td>6</td>\n<td>4</td>\n<td>4</td>\n</tr>\n<tr>\n<td>합</td>\n<td></td>\n<td></td>\n<td></td>\n<td><strong>29</strong> (평균 7.25)</td>\n<td><strong>16</strong> (평균 4)</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>② SRT (선점)</strong></p>\n<pre><code>| P1 | P2 | P3 | P4 | P2 | P1 |\n0    1    2    3    5    8    13\n</code></pre>\n<ul>\n<li>t=1: P2 도착. P1 남은 5 vs P2 4 → P2가 선점</li>\n<li>t=2: P3 도착. P2 남은 3 vs P3 1 → P3가 선점</li>\n<li>t=3: P3 종료, P4 도착. P1 5 / P2 3 / P4 2 → P4</li>\n<li>t=5: P4 종료 → P2(남은 3), t=8: P2 종료 → P1(남은 5)</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>P</th>\n<th>AT</th>\n<th>BT</th>\n<th>CT</th>\n<th>TAT</th>\n<th>WT</th>\n<th>RT</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>P1</td>\n<td>0</td>\n<td>6</td>\n<td>13</td>\n<td>13</td>\n<td>7</td>\n<td>0</td>\n</tr>\n<tr>\n<td>P2</td>\n<td>1</td>\n<td>4</td>\n<td>8</td>\n<td>7</td>\n<td>3</td>\n<td>0</td>\n</tr>\n<tr>\n<td>P3</td>\n<td>2</td>\n<td>1</td>\n<td>3</td>\n<td>1</td>\n<td>0</td>\n<td>0</td>\n</tr>\n<tr>\n<td>P4</td>\n<td>3</td>\n<td>2</td>\n<td>5</td>\n<td>2</td>\n<td>0</td>\n<td>0</td>\n</tr>\n<tr>\n<td>합</td>\n<td></td>\n<td></td>\n<td></td>\n<td><strong>23</strong> (평균 5.75)</td>\n<td><strong>10</strong> (평균 2.5)</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>비교</strong></p>\n<ul>\n<li>SRT는 짧은 작업(P3, P4)을 도착하자마자 처리해서 평균 TAT·WT가 작다.</li>\n<li>대신 긴 P1의 TAT가 6 → 13으로 늘어난다 = SRT의 기아 위험.</li>\n<li>P1은 SRT에서 RT 0인데 WT 7: 시작은 바로 했지만 중간에 계속 뺏겼기 때문. 선점에서 RT ≠ WT인 대표 모습.</li>\n</ul>\n<p><strong>이 표가 실제로 나온 기출 — 2024 지방직 #17</strong>: 이 표 그대로 주고 \"비선점 SJF로 스케줄링할 때 <strong>두 번째로 실행되는</strong> 프로세스는?\"을 물었다. ① SJF 간트차트가 P1 → <strong>P3</strong> → P4 → P2 순서이므로 정답은 <strong>P3</strong>. TAT·WT를 다 구할 필요 없이 실행 순서만 보면 되는 문제다.</p>\n<blockquote>\n<p>⚠️ 함정: SRT 간트차트의 비교 기준은 <strong>남은</strong> 실행시간, WT 계산은 <strong>원래</strong> BT로 뺀다. \"평균\"인지 \"총합\"인지 마지막에 꼭 확인.</p>\n</blockquote>"}];
const CARDS = [{"u": "db1", "q": "3단계 스키마 세 가지와 각각의 관점·개수는?", "a": "외부 스키마: 사용자·응용 관점, 여러 개 / 개념 스키마: 조직 전체 논리 구조, DB당 1개 / 내부 스키마: 물리적 저장 구조, 1개", "ex": "VIEW·DTO = 외부(용도별로 여러 개) · 테이블·@Entity = 개념(원본 하나) · 인덱스·디스크 배치 = 내부(내가 접근 못 함)", "trap": "\"개념 스키마는 사용자마다 다르다\" → X. 여러 개인 건 외부뿐."}, {"u": "db1", "q": "논리적 데이터 독립성과 물리적 데이터 독립성은 각각 어느 경계인가?", "a": "논리적 = 외부–개념 사이(위쪽 경계): 개념 스키마가 바뀌어도 외부 스키마·응용은 안 바뀜 / 물리적 = 개념–내부 사이(아래쪽 경계): 내부 스키마가 바뀌어도 개념 스키마는 안 바뀜", "ex": "CREATE INDEX를 추가해도 쿼리 한 글자 안 바뀜 → 물리적 독립성 · ALTER TABLE ADD COLUMN을 해도 기존 VIEW·API가 안 터짐 → 논리적 독립성", "trap": "\"논리 구조가 바뀌어도 응용이 안 바뀌는 것 = 물리적 독립성\" 처럼 이름만 바꿔치기한 선지 주의."}, {"u": "db1", "q": "DTO는 외부 스키마인가, 개념 스키마인가? 판정 질문은?", "a": "외부 스키마. 판정 질문: \"이거 여러 개 만들 수 있나?\" → 여러 개면 외부, 하나뿐인 원본이면 개념", "ex": "EmpListDto, EmpDetailDto처럼 API마다 따로 만든다 → 외부. @Entity Emp는 테이블과 1:1 원본 → 개념", "trap": "답안은 교재 표현으로: 개념 스키마 = \"조직 전체 관점의 논리 구조, DB당 1개\"."}, {"u": "db2", "q": "차수(Degree)와 기수(Cardinality)는 각각 무엇의 개수인가?", "a": "차수 = 애트리뷰트(열) 개수 / 기수 = 튜플(행) 개수", "ex": "학생(학번, 이름, 학과)에 3명 저장 → 차수 3, 기수 3. 학생을 1명 더 넣으면 기수만 4가 된다.", "trap": "\"차렷! 세로로 서!\" → 차수는 세로(열)."}, {"u": "db2", "q": "도메인이란?", "a": "하나의 애트리뷰트가 가질 수 있는 원자값들의 집합", "ex": "학과 도메인 = {컴공, 전자, 기계, ...} · 성별 도메인 = {남, 여}", "trap": ""}, {"u": "db2", "q": "릴레이션의 특성 3가지(자주 묻는 것)는?", "a": "① 튜플 사이에 순서 없음 ② 튜플 중복 없음 ③ 애트리뷰트 값은 원자값(더 쪼갤 수 없음). 애트리뷰트 사이 순서도 의미 없음", "ex": "(1001, 김철수, 컴공) 행이 두 번 들어갈 수 없다 · 전화번호 칸에 \"010-1, 010-2\" 두 개를 넣으면 원자값 위반", "trap": "\"속성 값은 서브 속성으로 다시 세분화할 수 있다\" → X."}, {"u": "db3", "q": "슈퍼키 / 후보키 / 기본키 / 대체키를 유일성·최소성으로 구분하면?", "a": "슈퍼키: 유일성만 / 후보키: 유일성 + 최소성 / 기본키: 후보키 중 선택된 1개 / 대체키: 기본키로 안 뽑힌 나머지 후보키", "ex": "학생(학번, 주민번호, 이름) — 후보키 {학번}, {주민번호} · 기본키 = 학번 → 대체키 = 주민번호 · (학번, 이름)은 슈퍼키지만 후보키 X(이름 빼도 유일)", "trap": "\"기본키로 선택되지 않은 후보키 = 슈퍼키\" → X, 대체키."}, {"u": "db3", "q": "개체 무결성과 참조 무결성 제약은?", "a": "개체 무결성: 기본키는 NULL·중복 불가 / 참조 무결성: 외래키는 참조하는 릴레이션의 기본키 값이거나 NULL", "ex": "수강(학번 FK)에 학생 테이블에 없는 학번 9999를 넣으면 참조 무결성 위반 · 학생 학번을 NULL로 넣으면 개체 무결성 위반", "trap": "\"외래키는 NULL을 가질 수 없다\" → X."}, {"u": "db3", "q": "인스턴스 표를 보고 후보키를 판정하는 순서는?", "a": "① 각 속성(조합)의 값이 행마다 다 다른지(유일성) ② 그중 하나라도 빼면 유일성이 깨지는지(최소성)", "ex": "A=(1,20,1,1,1), C=(7,7,3,4,6)일 때 A만·C만은 중복 있음, (A,C)는 5행 모두 다름 → (A,C)가 후보키", "trap": "(A,B,C) 전체는 유일해도 최소성 X → 슈퍼키일 뿐."}, {"u": "db4", "q": "1NF·2NF·3NF·BCNF에서 각각 제거하는 것은?", "a": "1NF: 반복 그룹·다중값(원자값으로) / 2NF: 부분 함수 종속 / 3NF: 이행 함수 종속 / BCNF: 후보키가 아닌 결정자", "ex": "암기 \"원–부–이–결\". 키 (학번,과목)에서 학번→이름이면 부분 종속(2NF 위반). 학번→학과→학과장이면 이행 종속(3NF 위반)", "trap": "\"정규화하면 조인이 줄어든다\" → X. 분해하므로 조인은 늘어난다."}, {"u": "db4", "q": "R(A,B,C,D), 키 (A,B), FD: (A,B)→C, B→D. 최고 정규형은?", "a": "1NF. D가 키의 일부인 B에만 종속 = 부분 함수 종속 → 2NF 위반", "ex": "해결: R1(A,B,C), R2(B,D)로 분해", "trap": "아래 단계(2NF)부터 판정하고 첫 위반에서 멈춘다."}, {"u": "db4", "q": "R(A,B,C), 키 A, FD: A→B, B→C. 최고 정규형은?", "a": "2NF. A→B→C 이행 종속 → 3NF 위반", "ex": "해결: R1(A,B), R2(B,C)로 분해", "trap": ""}, {"u": "db4", "q": "R(A,B,C), 후보키 (A,B), FD: (A,B)→C, C→A. 최고 정규형은?", "a": "3NF. 결정자 C가 후보키가 아님 → BCNF 위반 (A는 주요 속성이라 3NF는 통과)", "ex": "BCNF 판정 질문: \"모든 결정자가 후보키인가?\"", "trap": ""}, {"u": "db4", "q": "정규화의 목적과 반정규화는?", "a": "정규화: 중복 최소화, 삽입·삭제·갱신 이상(Anomaly) 제거 / 반정규화: 성능을 위해 의도적으로 테이블 병합·중복 허용", "ex": "\"질의 성능 향상을 위해 릴레이션을 병합하는 과정\" → 정규화가 아니라 반정규화", "trap": ""}, {"u": "db5", "q": "원자성과 고립성의 판정 기준은?", "a": "원자성: 트랜잭션 하나의 내부, All or Nothing (회복·Undo 담당) / 고립성: 동시에 실행되는 트랜잭션 사이, 중간 결과를 못 봄 (동시성 제어·락 담당)", "ex": "계좌이체 중 장애로 출금만 반영 → 원자성 문제 · 두 트랜잭션이 동시에 잔액을 읽어 갱신 손실 → 고립성 문제", "trap": "지문에 \"다른 트랜잭션\"이 나오면 고립성."}, {"u": "db5", "q": "ACID 각 성질을 담당하는 기법은?", "a": "원자성: 회복(Undo) / 일관성: 무결성 제약 / 고립성: 동시성 제어(2PL 등) / 지속성: 회복(Redo)", "ex": "commit 응답 직후 서버가 죽어도 데이터가 살아 있다 → 지속성, 재기동 시 Redo", "trap": "2PL(고립성)과 2PC(분산 커밋)를 섞지 말 것."}, {"u": "db6", "q": "Undo와 Redo는 각각 무엇이고 로그의 어떤 값을 쓰나?", "a": "Undo: commit 안 한 트랜잭션을 없던 일로, 옛 값(old) 사용, 원자성 / Redo: commit 한 트랜잭션을 끝까지 반영, 새 값(new) 사용, 지속성", "ex": "로그 <T, X, 10, 20>: T가 commit 못 하고 죽음 → Undo로 X=10 · T가 commit 했는데 디스크엔 아직 10 → Redo로 X=20", "trap": "\"Redo는 old value를 사용\" → X."}, {"u": "db6", "q": "지연 갱신과 즉시 갱신의 회복 연산 차이는?", "a": "지연 갱신: commit 후에야 DB에 씀 → Undo 불필요, Redo만 / 즉시 갱신: 연산 즉시 DB에 씀 → Undo와 Redo 모두 필요", "ex": "지연 갱신에서 commit 없이 죽은 T → 그냥 로그 버림(무조치) · 즉시 갱신이면 같은 T → Undo", "trap": "\"지연 갱신은 Undo와 Redo 모두 필요\" → X."}, {"u": "db6", "q": "체크포인트가 있을 때 트랜잭션별 처리 판정 2단계는?", "a": "① 장애 전에 commit이 있나? 있으면 Redo, 없으면 Undo(즉시 갱신) ② 그 commit이 체크포인트보다 앞이면 아무것도 안 함", "ex": "T1: CP 전 commit → 무조치 / T2: CP 전 시작·장애 전 commit → Redo / T3: 장애 때 실행 중 → Undo", "trap": "CP 이전에 완료된 T1을 Redo로 찍는 실수가 최다."}, {"u": "db6", "q": "WAL(Write-Ahead Logging) 규칙은?", "a": "데이터를 디스크에 쓰기 전에 로그를 먼저 안정 저장소에 기록한다", "ex": "버퍼의 변경 페이지를 디스크로 내리기 전에 그 변경의 로그 레코드가 먼저 기록되어 있어야 Undo가 가능", "trap": ""}, {"u": "db7", "q": "UNION과 UNION ALL의 차이는?", "a": "UNION: 중복 제거(정렬·해시 비용) / UNION ALL: 중복 유지, 그냥 이어 붙여 더 빠름", "ex": "A={1,2,3}, B={2,3,4} → UNION 1,2,3,4 (4행) · UNION ALL 1,2,3,2,3,4 (6행)", "trap": "\"ALL = 다 나와\" = 중복 유지."}, {"u": "db7", "q": "UNION이 성립하려면 두 SELECT가 어떤 조건을 맞춰야 하나?", "a": "컬럼 개수가 같고, 순서대로 데이터 타입이 호환되어야 한다. 컬럼 이름은 달라도 된다", "ex": "SELECT studno, name FROM STUDENT UNION SELECT profno, name FROM PROFESSOR → 이름 달라도 정상", "trap": ""}, {"u": "sw1", "q": "결합도를 강한(나쁜) 것부터 순서대로?", "a": "내용 > 공통 > 외부 > 제어 > 스탬프 > 자료", "ex": "암기 \"내공외제스자\". 다른 모듈 내부 변수를 직접 고침 = 내용 · 전역 변수 공유 = 공통 · flag 넘겨서 상대 흐름 제어 = 제어", "trap": "가장 바람직한 결합도 = 자료."}, {"u": "sw1", "q": "응집도를 약한(나쁜) 것부터 순서대로?", "a": "우연 < 논리 < 시간 < 절차 < 통신 < 순차 < 기능", "ex": "암기 \"우논시절 통순기\". init() 안에 같은 시점에 실행할 것들만 모음 = 시간 · 같은 입력 데이터를 쓰는 처리 모음 = 통신", "trap": "가장 바람직한 응집도 = 기능."}, {"u": "sw1", "q": "스탬프 결합도 vs 자료 결합도, 순차 응집도 vs 절차 응집도 구분은?", "a": "스탬프: 구조체·배열·객체를 통째로 전달 / 자료: 필요한 값만 전달 · 순차: 앞 요소의 출력이 뒤 요소의 입력 / 절차: 순서만 있고 데이터 연결은 약함", "ex": "calcTax(order 전체) → 스탬프, calcTax(order.price) → 자료 · 파싱 결과를 바로 검증에 넘김 → 순차", "trap": ""}, {"u": "sw2", "q": "GoF 디자인 패턴 3분류와 판정 기준은?", "a": "생성(객체를 만든다) / 구조(클래스·객체를 감싸고 조합한다) / 행위(객체 간 책임 분배·통신)", "ex": "생성 5개 \"싱팩앱빌프\": Singleton, Factory Method, Abstract Factory, Builder, Prototype", "trap": ""}, {"u": "sw2", "q": "구조 패턴 7개는? 각 한 줄 특징은?", "a": "Adapter(인터페이스 변환), Bridge(구현·추상 분리), Composite(트리, 부분-전체 동일 취급), Decorator(기능 동적 추가), Facade(단일 창구), Flyweight(공유로 메모리 절약), Proxy(대리자로 접근 제어)", "ex": "Java IO 스트림 겹쳐 쓰기 = Decorator · JPA 지연 로딩 객체 = Proxy", "trap": "Adapter·Bridge·Composite를 \"행위 패턴\"이라 한 선지 → X."}, {"u": "sw2", "q": "대표 행위 패턴과 특징은?", "a": "Observer(상태 변화 일괄 통지), Strategy(알고리즘 교체), Template Method(골격은 상위·세부는 하위), Command(요청 객체화), State, Iterator, Mediator, Chain of Responsibility, Memento, Visitor, Interpreter", "ex": "이벤트 리스너 = Observer · Servlet Filter 체인 = Chain of Responsibility", "trap": ""}, {"u": "sw2", "q": "Facade와 Adapter의 차이는?", "a": "Facade: 복잡한 서브시스템 앞에 단순한 단일 창구 제공 / Adapter: 맞지 않는 인터페이스를 변환해 호환", "ex": "\"서브시스템의 가장 앞쪽에서 인터페이스 역할\" → Facade · 110V 기기를 220V 콘센트에 → Adapter", "trap": ""}, {"u": "sw3", "q": "UML 구조(정적) 다이어그램과 행위(동적) 다이어그램은?", "a": "구조: 클래스, 객체, 컴포넌트, 배치, 패키지, 복합체 구조 / 행위: 유스케이스, 시퀀스, 커뮤니케이션, 상태, 활동, 타이밍", "ex": "시간·순서·상태 변화가 그려지면 행위, 관계·구성만 있으면 구조", "trap": "객체 다이어그램은 인스턴스라도 정적(구조)."}, {"u": "sw3", "q": "유스케이스의 include와 extend 차이는?", "a": "include: 기본 유스케이스가 반드시 포함해 실행 / extend: 특정 조건에서만 선택적으로 확장", "ex": "회원등록은 반드시 실명확인을 거친다 → include · 결제 중 쿠폰이 있을 때만 쿠폰 적용 → extend", "trap": ""}, {"u": "sw3", "q": "시퀀스 다이어그램과 커뮤니케이션 다이어그램의 차이는?", "a": "둘 다 상호작용 다이어그램. 시퀀스: 시간 순서(생명선)를 강조 / 커뮤니케이션: 객체 간 연결 관계를 강조", "ex": "\"메시지 순서에 초점, 시간 순서대로\" → 시퀀스", "trap": ""}, {"u": "sw4", "q": "화이트박스와 블랙박스 테스트의 기준과 대표 기법은?", "a": "화이트박스: 내부 코드·논리 경로 기준 — 기초 경로, 조건·루프·데이터 흐름 검사, 문장/분기/조건 커버리지 / 블랙박스: 명세(입출력) 기준 — 동치 분할, 경계값 분석, 원인-효과 그래프, 오류 예측, 비교 검사", "ex": "\"커버리지\"가 들어가면 무조건 화이트박스", "trap": "\"경계값 분석은 화이트박스\" → X."}, {"u": "sw4", "q": "동치 분할과 경계값 분석의 예는?", "a": "동치 분할: 입력을 유효·무효 클래스로 나눠 대표값 / 경계값: 경계와 그 바로 바깥 값", "ex": "입력 범위 1~100 → 동치: 50(유효), -5(무효), 150(무효) · 경계값: 0, 1, 100, 101", "trap": ""}, {"u": "sw4", "q": "맥케이브 순환 복잡도 계산식은?", "a": "V(G) = E − N + 2 (간선 − 노드 + 2) = 조건(분기) 수 + 1", "ex": "노드 6, 간선 8인 흐름 그래프 → 8 − 6 + 2 = 4 → 독립 경로 4개", "trap": ""}, {"u": "sw4", "q": "분기 커버리지 vs 조건 커버리지 vs 다중 조건 커버리지?", "a": "분기: 결정문 전체 결과가 참·거짓 한 번씩 / 조건: 결정문 안의 각 개별 조건식이 참·거짓 한 번씩 / 다중 조건: 개별 조건의 모든 조합", "ex": "if (A && B): 분기 → 전체 T/F 2가지 · 조건 → A, B 각각 T/F · 다중 조건 → (T,T)(T,F)(F,T)(F,F)", "trap": ""}, {"u": "sw5", "q": "하향식·상향식 통합에서 쓰는 가짜 모듈은?", "a": "하향식: 아직 없는 하위 모듈을 대신하는 스텁(Stub) / 상향식: 아직 없는 상위 모듈(호출자)을 대신하는 드라이버(Driver)", "ex": "암기 \"하–스, 상–드\". 화면(상위)은 있는데 결제 모듈(하위)이 없다 → 결제 스텁", "trap": "\"상향식 통합에는 스텁이 필요\" → X."}, {"u": "sw5", "q": "하향식 통합의 진행 방식과 상향식의 진행 방식은?", "a": "하향식: 상위 → 하위, 깊이 우선 또는 너비 우선 / 상향식: 최하위 모듈을 클러스터로 묶어 위로", "ex": "\"넓이 우선·깊이 우선 방식\"이 나오면 하향식 통합 테스트", "trap": "시스템 테스트 설명에 깊이·너비 우선을 붙인 선지 → X."}, {"u": "sw5", "q": "회귀 테스트와 빅뱅 통합이란?", "a": "회귀: 변경 후 기존 기능이 여전히 동작하는지 재확인 / 빅뱅: 모든 모듈을 한 번에 통합 (스텁·드라이버 없음)", "ex": "버그 수정 PR 후 기존 테스트 스위트를 다시 돌림 → 회귀 테스트", "trap": ""}, {"u": "sec1", "q": "CIA 3요소와 각각을 위협하는 공격은?", "a": "기밀성: 인가되지 않은 자가 못 봄 — 도청·스누핑·트래픽 분석 / 무결성: 위·변조 방지 — 변조·위장·재전송 / 가용성: 필요할 때 사용 — DoS·DDoS", "ex": "패킷을 엿봄 → 기밀성 · 송금액을 바꿈 → 무결성 · 서버를 마비시킴 → 가용성", "trap": "\"통계적 방법으로 내용 분석\"도 기밀성 침해."}, {"u": "sec1", "q": "인증·인가·부인방지의 차이는?", "a": "인증: 너 누구냐(신원 확인) / 인가: 이거 해도 되냐(권한 확인) / 부인방지: 보낸 사실을 부인 못 하게", "ex": "로그인 = 인증 → 관리자 메뉴 접근 허용 여부 = 인가 · 전자계약 서명 = 부인방지", "trap": ""}, {"u": "sec1", "q": "위협·취약점·위험의 관계는?", "a": "위협이 취약점을 이용해 실제 손실이 날 가능성 = 위험", "ex": "해커(위협)가 패치 안 된 서버(취약점)를 노림 → 고객정보 유출 가능성(위험)", "trap": ""}, {"u": "sec2", "q": "대칭키와 공개키 암호의 장단점·대표 알고리즘은?", "a": "대칭키: 같은 키, 빠름, 키 배송 문제 — DES, 3DES, AES, SEED, ARIA / 공개키: 공개키+개인키, 느림, 키 분배 쉬움·전자서명 가능 — RSA, ECC, ElGamal", "ex": "실무: 세션키(대칭)를 공개키로 감싸 전달하고 본문은 대칭키로 암호화", "trap": "\"DES는 공개키 알고리즘\" → X."}, {"u": "sec2", "q": "n명이 서로 통신할 때 필요한 키 개수는?", "a": "대칭키: n(n−1)/2 / 공개키: 2n", "ex": "10명 → 20명 확장 시 추가 키: 대칭 190 − 45 = 145, 공개키 40 − 20 = 20", "trap": "\"추가로\" 필요한 개수면 차이를 구한다."}, {"u": "sec2", "q": "RSA로 기밀성을 보장할 때와 전자서명할 때 쓰는 키는?", "a": "기밀성: 수신자의 공개키로 암호화 → 수신자의 개인키로 복호화 / 서명: 송신자의 개인키로 서명 → 송신자의 공개키로 검증", "ex": "철수→영희 비밀 메시지: 영희 공개키로 잠금 · 철수가 서명: 철수 개인키로 서명", "trap": "\"철수가 자신의 공개키로 암호화\" → X. 주어 바꿔치기."}, {"u": "sec2", "q": "암호학적 해시 함수의 특성 4가지는?", "a": "일방향성(역상 저항성), 제2역상 저항성, 충돌 저항성, 고정 길이 출력", "ex": "SHA-256은 1글자든 1GB든 항상 256비트 출력", "trap": "\"입력 길이에 비례해 출력 길이가 커진다\" → X."}, {"u": "sec2", "q": "해시 → MAC → 전자서명은 무엇을 보장하나?", "a": "해시: 무결성 / MAC: 무결성 + 메시지 인증 (공유 비밀키) / 전자서명: 무결성 + 인증 + 부인방지 (개인키)", "ex": "공유 비밀키로 해시값을 암호화해 보냄 = MAC 구조 → 무결성은 O, 부인방지는 X", "trap": "MAC은 키를 둘이 공유하므로 부인방지 불가. 본문을 암호화하지도 않는다."}, {"u": "sec2", "q": "MAC과 전자서명에서 송신자·수신자가 쓰는 키는?", "a": "MAC: 송신자·수신자 모두 같은 공유 비밀키로 MAC을 계산해 비교 / 전자서명: 송신자 개인키로 작성, 수신자는 송신자 공개키로 검증", "ex": "HMAC-SHA256(메시지, 공유키) 값을 양쪽에서 각자 계산해 같으면 통과", "trap": "여기 MAC(Message Authentication Code)은 강제 접근통제 MAC과 다르다."}, {"u": "sec3", "q": "인증서에 들어 있는 것과 CA가 서명할 때 쓰는 키는?", "a": "사용자 정보, 사용자 공개키, 발급자, 유효기간, CA의 전자서명 / CA는 자신의 개인키로 서명", "ex": "브라우저는 CA의 공개키로 서버 인증서 서명을 검증한다", "trap": ""}, {"u": "sec3", "q": "사용자 인증 3요소와 MFA 조건은?", "a": "지식(아는 것: 비밀번호·PIN), 소유(가진 것: OTP·스마트카드), 존재·생체(지문·홍채·얼굴) / MFA는 서로 다른 유형 2개 이상", "ex": "비밀번호 + OTP = MFA O · 비밀번호 + PIN = 둘 다 지식 → MFA X", "trap": ""}, {"u": "sec3", "q": "SSO의 장점과 약점은?", "a": "한 번 인증으로 여러 시스템 사용 → 편리·비밀번호 관리 감소 / 최초 인증이 뚫리면 모든 시스템에 연쇄 피해", "ex": "회사 포털 로그인 한 번으로 메일·그룹웨어·인사시스템 접속", "trap": ""}, {"u": "sec3", "q": "커버로스(Kerberos)의 핵심은?", "a": "대칭키 기반 네트워크 인증, KDC = AS + TGS, 티켓 사용, 비밀번호를 네트워크로 직접 보내지 않음, 타임스탬프로 재전송 방지", "ex": "로그인 → AS가 TGT 발급 → TGS가 서비스 티켓 발급 → 서버 접근", "trap": "\"공개키 기반 구조로 인증\" → X. TGT는 로그인 때 한 번, 서비스마다 받는 건 서비스 티켓."}, {"u": "sec4", "q": "접근통제의 흐름 4단계는?", "a": "식별(Identification) → 인증(Authentication) → 인가(Authorization) → 책임추적(Accountability)", "ex": "아이디 입력 → 비밀번호 확인 → 권한 부여 → 감사 로그 기록", "trap": "감사 추적 = 행위 기록. \"위험 평가·대응책 수립\"은 위험 분석."}, {"u": "sec4", "q": "DAC·MAC·RBAC를 한 줄씩 구분하면?", "a": "DAC: 소유자가 신원(ID) 기반으로 권한 결정 / MAC: 중앙 정책이 보안 등급(레이블)으로 결정 / RBAC: 역할에 권한을 주고 사용자를 역할에 배정", "ex": "리눅스 chmod = DAC · 군 비밀등급 = MAC · 회계담당자 Role에 결제 승인 권한 = RBAC", "trap": "\"DAC는 보안 레이블 기반\" → X. BLP·Biba는 둘 다 MAC 모델."}, {"u": "sec4", "q": "Bell-LaPadula의 목적과 두 규칙은?", "a": "기밀성. No Read Up(단순 보안: 상위 읽기 금지), No Write Down(★-속성: 하위 쓰기 금지)", "ex": "Secret 등급 사용자는 Top Secret 문서를 못 읽고, Confidential 문서에 쓰지도 못한다 (쓰려면 같거나 위로)", "trap": "★-속성 = 쓰기 규칙. 쓰기 조건은 주체 등급 ≤ 객체 등급."}, {"u": "sec4", "q": "Biba의 목적과 두 규칙은?", "a": "무결성. No Read Down(낮은 무결성 읽기 금지), No Write Up(높은 무결성에 쓰기 금지)", "ex": "검증된 회계 DB 담당자는 출처 불명 엑셀을 읽어 반영하지 않고, 인턴은 회계 DB에 쓸 수 없다", "trap": "복원 한 줄: 기밀성은 아래로 새는 게 문제(Down 금지), 무결성은 위가 오염되는 게 문제(Up 금지)."}, {"u": "sec4", "q": "Clark-Wilson의 핵심과 CDI·UDI·TP·IVP는?", "a": "상업적 무결성. 잘 형성된 트랜잭션 + 직무 분리, 사용자는 허가된 프로그램(TP)을 통해서만 데이터 변경 / CDI: 보호할 데이터, UDI: 검증 안 된 입력, TP: 변환 프로그램, IVP: 무결성 검증 프로그램", "ex": "은행 직원이 DB에 직접 UPDATE (X) → 승인된 입출금 프로그램으로만 변경 (O)", "trap": ""}, {"u": "sec4", "q": "만리장성(Brewer-Nash) 모델은?", "a": "이해 충돌 방지 모델. 주체의 과거 접근 이력에 따라 경쟁 관계 회사 정보 접근을 동적으로 막음", "ex": "A은행 자문을 맡은 컨설턴트는 이후 경쟁사 B은행 자료에 접근 불가", "trap": "\"정보 흐름 모델 최초의 수학적 모델\" = BLP."}, {"u": "os1", "q": "SSTF와 SCAN의 차이는?", "a": "SSTF: 현재 헤드에서 가장 가까운 요청부터 (매번 현재 위치 기준, 기아 가능) / SCAN: 한 방향으로 끝까지 가며 처리 후 반대 방향으로 (엘리베이터)", "ex": "헤드 50, 큐 20 30 40 70 80 → SSTF: 40→30→20→70→80 (10+10+10+50+10=90)", "trap": ""}, {"u": "os1", "q": "C-SCAN과 LOOK, C-LOOK의 차이는?", "a": "C-SCAN: 끝까지 처리 후 반대쪽 끝으로 점프(서비스 없음)해서 같은 방향으로 다시 / LOOK: SCAN인데 마지막 요청에서 방향 전환 / C-LOOK: C-SCAN인데 마지막 요청에서 반대편 첫 요청으로 점프", "ex": "헤드 55, 0 방향 C-SCAN, 큐 25 30 47 50 63 75 100 → 50 47 30 25 → 점프 → 100 75 63 (마지막 63)", "trap": "0 방향이면 점프 후에도 큰 번호부터 내려온다."}, {"u": "os2", "q": "FIFO·LRU·LFU·OPT가 내보내는 페이지는?", "a": "FIFO: 가장 먼저 들어온 것 / LRU: 가장 오랫동안 사용 안 된 것 / LFU: 사용 횟수가 가장 적은 것 / OPT: 앞으로 가장 오래 안 쓸 것", "ex": "프레임 [1,2,3]이고 최근 참조가 1→3→2 순이었다면 4가 올 때 LRU는 1을 내보낸다", "trap": "LRU는 hit 때도 \"최근 사용\"으로 순서를 갱신. FIFO는 hit 돼도 그대로."}, {"u": "os2", "q": "벨레이디 모순과 스래싱은?", "a": "벨레이디 모순: FIFO에서 프레임을 늘렸는데 페이지 부재가 오히려 늘 수 있음 / 스래싱: 페이지 부재가 너무 잦아 실제 실행보다 교체에 시간을 더 씀", "ex": "참조열 1 2 3 4 1 2 5 1 2 3 4 5 → FIFO 프레임 3개: 9번, 4개: 10번", "trap": "OPT는 부재 최소지만 미래를 알아야 해서 구현 불가."}, {"u": "os3", "q": "선점·비선점 스케줄링 분류는?", "a": "비선점: FCFS, SJF, HRN, 비선점 우선순위 / 선점: SRT, RR, MLFQ, 선점 우선순위", "ex": "SRT는 SJF의 선점판: 새 프로세스가 도착할 때마다 남은 시간을 비교해 더 짧으면 뺏는다", "trap": ""}, {"u": "os3", "q": "AT, BT, CT, TAT, WT, RT는 각각 무엇인가?", "a": "AT 도착 시간 / BT 실행시간(= CPU 사용시간 = 서비스 시간) / CT 종료 시각 / TAT 반환시간 = CT − AT / WT 대기시간 = TAT − BT / RT 응답시간 = 처음 CPU 받은 시각 − AT", "ex": "P(AT 2, BT 5, CT 12) → TAT 10, WT 5. 비선점이면 RT도 5, 선점으로 중간에 끊겼다면 RT는 더 작을 수 있다", "trap": "대기 구간을 직접 세지 말고 TAT를 먼저 구한 뒤 BT를 뺀다."}, {"u": "os3", "q": "HRN 우선순위 공식은?", "a": "(WT + BT) ÷ BT = (대기시간 + 서비스시간) ÷ 서비스시간, 값이 클수록 먼저 실행", "ex": "대기 15·서비스 3 → 6 / 대기 12·서비스 4 → 4 → 앞의 것이 먼저", "trap": "분모는 서비스시간(BT). 응답률(Response Ratio) 약어 RR은 Round Robin과 다르다."}, {"u": "os3", "q": "AT/BT가 (P1 0/6, P2 1/4, P3 2/1, P4 3/2)일 때 비선점 SJF와 SRT의 실행 순서는?", "a": "SJF: P1 → P3 → P4 → P2 (P1은 비선점이라 끝까지) / SRT: P1 → P2 → P3 → P4 → P2 → P1 (도착할 때마다 남은 시간 비교)", "ex": "TAT 합 SJF 29 vs SRT 23, WT 합 SJF 16 vs SRT 10. 2024 지방직 #17은 SJF에서 두 번째 실행 = P3를 물었다", "trap": "SRT 비교는 남은 실행시간, WT 계산은 원래 BT로."}, {"u": "os3", "q": "기아(starvation) 가능 기법과 해결책은?", "a": "SJF·SRT(긴 작업), 우선순위(낮은 우선순위)에서 발생 가능 / 해결: 에이징(오래 기다리면 우선순위 상승), HRN도 SJF의 기아 보완", "ex": "FCFS·RR은 차례가 반드시 오므로 기아 없음", "trap": ""}];
const CHEAT = "<p>손으로 <strong>과정을 써야</strong> 맞는 문제들. 시험장에서 이 유형이 보이면 머리로 풀지 말고 <strong>표·간트차트·트레이스부터</strong> 그린다.</p>\n<table>\n<thead>\n<tr>\n<th>단원</th>\n<th>문제 유형</th>\n<th>풀이 시작점</th>\n<th>단골 함정</th>\n<th>위치</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>디스크 스케줄링</strong></td>\n<td>총 헤드 이동거리 / 처리 순서 / 마지막 트랙</td>\n<td>큐를 <strong>정렬</strong>해서 수직선에 찍기</td>\n<td><strong>진행 방향</strong>, C-계열 점프 거리 포함 여부</td>\n<td>PART 4-1</td>\n</tr>\n<tr>\n<td><strong>페이지 교체</strong></td>\n<td>페이지 부재 횟수 (FIFO·LRU·OPT·LFU)</td>\n<td>프레임 칸 표 그리고 <strong>F 표시</strong></td>\n<td>초기 빈 프레임도 부재로 셈, LRU는 <strong>hit 때도 갱신</strong></td>\n<td>PART 4-2</td>\n</tr>\n<tr>\n<td><strong>프로세스 스케줄링</strong></td>\n<td>평균 대기·반환시간 / 실행 순서</td>\n<td><strong>간트차트</strong> → TAT = CT−AT, WT = TAT−BT</td>\n<td>SRT 선점 시점, RR <strong>큐 복귀 순서</strong>, HRN 공식</td>\n<td>PART 4-3</td>\n</tr>\n<tr>\n<td>정규화 판정</td>\n<td>최고 정규형 / 올바른 분해</td>\n<td>후보키 확정 → 결정자 하나씩</td>\n<td>아래 단계부터 판정, <strong>첫 위반에서 멈춤</strong></td>\n<td>PART 1-4</td>\n</tr>\n<tr>\n<td>회복 기법</td>\n<td>트랜잭션별 Redo/Undo/무조치</td>\n<td>commit 유무 → CP 위치</td>\n<td>CP 전 commit = 무조치, <strong>지연 갱신엔 Undo 없음</strong></td>\n<td>PART 1-6</td>\n</tr>\n<tr>\n<td>키 판정</td>\n<td>인스턴스 보고 후보키</td>\n<td>유일성 → 최소성 순</td>\n<td>(A,B,C)는 슈퍼키지만 후보키 X</td>\n<td>PART 1-3</td>\n</tr>\n<tr>\n<td>카디널리티 · UNION</td>\n<td>결과 행 수</td>\n<td>조인 매칭 행 / 중복 개수 세기</td>\n<td>UNION은 중복 제거, ALL은 유지</td>\n<td>PART 1-2, 1-7</td>\n</tr>\n<tr>\n<td>결합도·응집도</td>\n<td>최선/최악 설계 고르기</td>\n<td>양 끝(자료·기능 / 내용·우연)</td>\n<td>스탬프 vs 자료, 순차 vs 절차</td>\n<td>PART 2-1</td>\n</tr>\n<tr>\n<td>암호 계산</td>\n<td>필요 키 개수 / 키 방향</td>\n<td>대칭 n(n−1)/2, 공개키 2n</td>\n<td>\"추가로\" 필요한 개수는 <strong>차이</strong>로</td>\n<td>PART 3-4</td>\n</tr>\n<tr>\n<td>BLP / Biba</td>\n<td>읽기·쓰기 허용 방향</td>\n<td>기밀성 = Down 금지 / 무결성 = Up 금지</td>\n<td>★-속성 = No Write Down</td>\n<td>PART 3-15~17</td>\n</tr>\n</tbody>\n</table>";
const SUBJECTS = [["all","전체"],["db","데이터베이스"],["sw","소프트웨어공학"],["sec","정보보안"],["os","운영체제"]];
const FAIL = {ok:["꺼냈다","var(--ok)"],recall:["회상실패","var(--bad)"],mix:["개념혼동","var(--mix)"],new:["미학습","var(--muted)"]};
const KEY = "concept_recall_v1";

/* ---------- storage ---------- */
let S = {subject:"all", tab:"note", rec:{}};
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
CARDS.forEach((c,i)=>c.id = c.u+"-"+i);
const unitById = Object.fromEntries(UNITS.map(u=>[u.id,u]));
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function unitsOf(sub){ return UNITS.filter(u=>sub==="all"||u.subject===sub); }
function cardsOf(sub){ return CARDS.filter(c=>sub==="all"||unitById[c.u].subject===sub); }
function okRatio(unitId){ const cs=CARDS.filter(c=>c.u===unitId); if(!cs.length) return 0; return cs.filter(c=>S.rec[c.id]&&S.rec[c.id].last==="ok").length/cs.length; }

function renderStat(){
  const total=CARDS.length, ok=CARDS.filter(c=>S.rec[c.id]&&S.rec[c.id].last==="ok").length;
  $("#stat").textContent = `꺼낸 카드 ${ok} / ${total}`;
}
function renderSeg(){
  $("#seg").innerHTML = SUBJECTS.map(([k,v])=>`<button aria-pressed="${S.subject===k}" data-s="${k}">${v}</button>`).join("");
  $("#seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.subject=b.dataset.s; save(); route();});
}
const TABS=[["note","📖","노트"],["recall","🃏","회상 카드"],["calc","🧮","계산 연습"],["weak","📌","약점"]];
function renderTabs(){

  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t; save(); route(); window.scrollTo(0,0);});
}
function route(){
  renderSeg(); renderTabs(); renderStat();

let deck=null;

      <div class="chk"><input type="checkbox" id="wk"><label for="wk" style="margin:0;color:var(--ink);font-size:14.5px">약점 카드만 (마지막에 못 꺼낸 카드)</label></div>

  $("#st").onclick=()=>startDeck({unit:$("#u").value||null, weakOnly:$("#wk").checked, shuffle:$("#sh").checked});
}
function startDeck(o){
  let cs = o.unit ? CARDS.filter(c=>c.u===o.unit) : cardsOf(S.subject);
  if(o.weakOnly) cs = cs.filter(c=>S.rec[c.id] && S.rec[c.id].last!=="ok");
  cs = cs.slice(); if(o.shuffle) for(let i=cs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cs[i],cs[j]]=[cs[j],cs[i]];}
  if(!cs.length){ $("#view").innerHTML=`<div class="empty">조건에 맞는 카드가 없습니다.<br>약점 카드가 없다면 전체 카드로 시작해 보세요.</div><button class="btn ghost block" id="bk2">설정으로</button>`; $("#bk2").onclick=viewRecallSetup; return; }
  deck={cards:cs,i:0,res:{ok:0,recall:0,mix:0,new:0}};
  showCard();
}
function showCard(){
  const c=deck.cards[deck.i], u=unitById[c.u], n=deck.cards.length;

       <div class="grade">

       </div>

   </section>`;
  $("#show").onclick=()=>{ $("#rv").classList.add("on"); $("#hint").style.display="none"; };
  $("#quit").onclick=finishDeck;
  $("#view").querySelectorAll(".grade button").forEach(b=>b.onclick=()=>{
    const g=b.dataset.g; const r=S.rec[c.id]||{n:0,hist:{}};
    r.n++; r.last=g; r.hist[g]=(r.hist[g]||0)+1; r.t=Date.now(); S.rec[c.id]=r; save();

  });
}
function finishDeck(){
  const r=deck.res, tot=r.ok+r.recall+r.mix+r.new;
  $("#view").innerHTML = `<div class="done"><div class="big">${r.ok} / ${tot}</div><p>꺼낸 카드</p>
    <p style="color:var(--muted);font-size:14.5px">회상실패 ${r.recall} · 개념혼동 ${r.mix} · 미학습 ${r.new}</p></div>
    <div class="row"><button class="btn primary" style="flex:1" id="again">못 꺼낸 카드만 다시</button><button class="btn ghost" style="flex:1" id="setup">설정으로</button></div>`;
  const missed = deck.cards.slice(0,deck.i).filter(c=>S.rec[c.id]&&S.rec[c.id].last!=="ok");
  $("#again").disabled = !missed.length;
  $("#again").onclick=()=>{ deck={cards:missed,i:0,res:{ok:0,recall:0,mix:0,new:0}}; showCard(); };
  $("#setup").onclick=viewRecallSetup;

/* ---------- calc ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
let calcType=null, cur=null;
const CALC=[["disk","디스크 스케줄링","총 헤드 이동거리"],["page","페이지 교체","페이지 부재 횟수"],["cpu","CPU 스케줄링","대기시간 총합"],["rec","회복 판정","Redo / Undo / 무조치"]];
function viewCalc(){
  $("#view").innerHTML = `<details class="cheat"><summary>계산형 체크 표 펼치기</summary><div class="note">${CHEAT}</div></details>
    <div class="calc-pick">${CALC.map(([k,t,s])=>`<button data-k="${k}" aria-pressed="${calcType===k}"><b>${t}</b><span>${s}</span></button>`).join("")}</div>
    <div id="pz"></div>`;
  $("#view").querySelectorAll(".calc-pick button").forEach(b=>b.onclick=()=>{calcType=b.dataset.k; viewCalc(); newProblem();});
  if(calcType && cur && cur.type===calcType) drawProblem(); else if(calcType) newProblem();
  else $("#pz").innerHTML=`<div class="empty">유형을 고르면 매번 새 문제가 만들어집니다.<br>답을 넣고 채점하면 풀이 과정 전체가 나옵니다.</div>`;
}
function newProblem(){ cur=({disk:genDisk,page:genPage,cpu:genCpu,rec:genRec})[calcType](); cur.type=calcType; drawProblem(); }
function drawProblem(){
  const p=cur;
  let body = `<div class="prob"><span class="alg">${p.alg}</span><p class="alg-desc">${p.desc}</p>${p.html}`;
  if(p.type==="rec"){
    body += p.tx.map(t=>`<div class="rec-q" data-t="${t.name}"><b>${t.name}</b>${["Redo","Undo","무조치"].map(o=>`<button data-o="${o}" aria-pressed="false">${o}</button>`).join("")}<span class="mark"></span></div>`).join("");
    body += `<div class="row" style="margin-top:12px"><button class="btn primary" style="flex:1" id="chk">채점</button><button class="btn ghost" style="flex:1" id="nx">새 문제</button></div>`;
  } else {
    body += `<div class="ansrow"><input id="ans" inputmode="decimal" placeholder="${p.ask}" aria-label="${p.ask}"><button class="btn primary" id="chk">채점</button></div>
      <button class="btn ghost block" style="margin-top:8px" id="nx">새 문제</button>`;
  }
  body += `<div id="out"></div></div>`;
  $("#pz").innerHTML=body;
  $("#nx").onclick=newProblem;
  if(p.type==="rec"){
    $("#pz").querySelectorAll(".rec-q button").forEach(b=>b.onclick=()=>{ b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); });
    $("#chk").onclick=()=>{
      let right=0;
      p.tx.forEach(t=>{ const row=$(`.rec-q[data-t="${t.name}"]`); const sel=row.querySelector('[aria-pressed="true"]'); const m=row.querySelector(".mark");
        const ok = sel && sel.dataset.o===t.ans; if(ok) right++;
        m.textContent = ok ? "맞음" : `정답 ${t.ans}`; m.style.color = ok?"var(--ok)":"var(--bad)"; });
      $("#out").innerHTML = `<div class="verdict ${right===p.tx.length?"ok":"bad"}">${right} / ${p.tx.length} 맞음</div><div class="trace">${p.trace}</div>`;
    };
  } else {
    const go=()=>{ const v=parseFloat($("#ans").value); const ok=Math.abs(v-p.answer)<0.01;
      $("#out").innerHTML = `<div class="verdict ${ok?"ok":"bad"}">${isNaN(v)?"답을 입력하세요. ":(ok?"정답입니다. ":"오답입니다. ")}정답 ${p.answer}</div><div class="trace">${p.trace}</div>`; };
    $("#chk").onclick=go; $("#ans").onkeydown=e=>{ if(e.key==="Enter") go(); };
  }
}

/* disk */
const DISK_DESC={
 "FCFS":"요청이 들어온 순서 그대로 처리합니다.",
 "SSTF":"현재 헤드 위치에서 가장 가까운 요청을 매번 다시 골라 처리합니다.",
 "SCAN":"진행 방향으로 디스크 끝(0 또는 199)까지 가며 처리하고, 방향을 바꿔 돌아오며 처리합니다.",
 "C-SCAN":"진행 방향으로 끝까지 처리한 뒤 반대쪽 끝으로 점프(서비스 없음)해서 같은 방향으로 다시 처리합니다. 점프 거리도 이동거리에 포함합니다.",
 "LOOK":"SCAN과 같지만 끝까지 가지 않고 마지막 요청에서 방향을 바꿉니다.",
 "C-LOOK":"C-SCAN과 같지만 마지막 요청에서 반대편 첫 요청으로 점프합니다. 점프 거리도 이동거리에 포함합니다."};
function genDisk(){
  const alg=pick(Object.keys(DISK_DESC)); const head=R(30,170); const set=new Set();
  while(set.size<7){ const v=R(0,199); if(v!==head) set.add(v); }
  if(![...set].some(v=>v<head)||![...set].some(v=>v>head)) return genDisk();
  const q=[...set]; const dir=pick(["up","down"]); const MAX=199;
  let order=[], path=[head];
  const asc=q.slice().sort((a,b)=>a-b), lo=asc.filter(x=>x<head), hi=asc.filter(x=>x>head);
  if(alg==="FCFS"){ order=q.slice(); path=path.concat(order); }
  else if(alg==="SSTF"){ let p=head, rest=q.slice(); while(rest.length){ rest.sort((a,b)=>Math.abs(a-p)-Math.abs(b-p)||a-b); p=rest.shift(); order.push(p);} path=path.concat(order); }
  else {
    const fwd = dir==="up"?hi:lo.slice().reverse(), back = dir==="up"?lo.slice().reverse():hi, end = dir==="up"?MAX:0, other = dir==="up"?0:MAX;
    if(alg==="SCAN"){ order=fwd.concat(back); path=path.concat(fwd); if(back.length){ path.push(end); path=path.concat(back);} }
    if(alg==="LOOK"){ order=fwd.concat(back); path=path.concat(order); }
    if(alg==="C-SCAN"){ const wrap = dir==="up"?lo:hi.slice().reverse(); order=fwd.concat(wrap); path=path.concat(fwd); if(wrap.length){ path.push(end, other); path=path.concat(wrap);} }
    if(alg==="C-LOOK"){ const wrap = dir==="up"?lo:hi.slice().reverse(); order=fwd.concat(wrap); path=path.concat(order); }
  }
  let total=0, steps=[];
  for(let i=1;i<path.length;i++){ const d=Math.abs(path[i]-path[i-1]); total+=d; steps.push(`${path[i-1]} → ${path[i]} (${d})`); }
  const needDir = !["FCFS","SSTF"].includes(alg);
  return {alg, desc:DISK_DESC[alg], ask:"총 이동거리",
    html:`<p>트랙 0~199, 현재 헤드 <b>${head}</b>${needDir?`, 진행 방향 <b>${dir==="up"?"199쪽(증가)":"0쪽(감소)"}</b>`:""}</p><p>요청 큐: <span class="mono">${q.join(", ")}</span></p><p>총 헤드 이동거리는?</p>`,
    answer:total,
    trace:`<div class="step">정렬: ${asc.join("  ")}   (헤드 ${head})\n처리 순서: ${order.join(" → ")}\n\n${steps.join("\n")}\n\n합계 = ${total}</div>`};
}

/* page */
const PAGE_DESC={
 "FIFO":"가장 먼저 들어온 페이지를 내보냅니다. 적중(hit)해도 순서가 바뀌지 않습니다.",
 "LRU":"가장 오랫동안 사용되지 않은 페이지를 내보냅니다. 적중하면 그 페이지가 '가장 최근'으로 갱신됩니다.",
 "OPT":"앞으로 가장 오랫동안 사용되지 않을 페이지를 내보냅니다. 다시 안 쓰는 페이지가 여럿이면 먼저 들어온 것을 내보냅니다.",
 "LFU":"참조 횟수가 가장 적은 페이지를 내보냅니다. 횟수가 같으면 먼저 들어온 것을 내보냅니다. 내보낸 페이지의 횟수는 0으로 초기화합니다."};
function genPage(){
  const alg=pick(Object.keys(PAGE_DESC)), n=pick([3,3,4]), len=12, ref=[];
  for(let i=0;i<len;i++) ref.push(R(0,6));
  let fr=[], cnt={}, load={}, faults=0, rows=[];
  ref.forEach((p,i)=>{
    cnt[p]=(cnt[p]||0)+1; let hit=fr.includes(p), victim=null;
    if(hit){ if(alg==="LRU"){ fr.splice(fr.indexOf(p),1); fr.push(p);} }
    else{
      faults++;
      if(fr.length===n){
        if(alg==="FIFO"||alg==="LRU") victim=fr[0];
        if(alg==="OPT"){ const fut=ref.slice(i+1); let best=-1; fr.forEach(x=>{ const d=fut.indexOf(x)===-1?999:fut.indexOf(x); if(d>best){best=d;victim=x;} }); }
        if(alg==="LFU"){ victim=fr.slice().sort((a,b)=>(cnt[a]-cnt[b])||(load[a]-load[b]))[0]; }
        fr.splice(fr.indexOf(victim),1); if(alg==="LFU") cnt[victim]=0;
      }
      fr.push(p); load[p]=i;
    }
    rows.push({p,fr:fr.slice(),hit,victim});
  });
  const head=`<tr><th>참조</th>${rows.map(r=>`<th>${r.p}</th>`).join("")}</tr>`;
  let body=""; for(let k=0;k<n;k++) body+=`<tr><th>${k===0?(alg==="FIFO"||alg==="LRU"?"오래된 쪽":"프레임"):""}</th>${rows.map(r=>`<td>${r.fr[k]!==undefined?r.fr[k]:""}</td>`).join("")}</tr>`;
  const frow=`<tr><th>부재</th>${rows.map(r=>r.hit?"<td></td>":`<td class="f">F</td>`).join("")}</tr>`;
  const vrow=`<tr><th>내보냄</th>${rows.map(r=>`<td>${r.victim!==null?r.victim:""}</td>`).join("")}</tr>`;
  return {alg, desc:PAGE_DESC[alg], ask:"페이지 부재 횟수",
    html:`<p>프레임 <b>${n}</b>개, 처음에는 비어 있음</p><p>참조열: <span class="mono">${ref.join(" ")}</span></p><p>페이지 부재는 몇 번?</p>`,
    answer:faults,
    trace:`<table>${head}${body}${frow}${vrow}</table><div class="step">처음 빈 프레임을 채우는 것도 부재로 셉니다.${alg==="FIFO"||alg==="LRU"?"\n프레임 칸은 위쪽이 다음에 내보낼 후보(가장 오래됨)입니다.":""}\n부재 합계 = ${faults}</div>`};
}

/* cpu */
const CPU_DESC={
 "FCFS":"도착 순서대로 실행합니다. 비선점.",
 "SJF":"준비된 것 중 실행시간이 가장 짧은 것을 실행합니다. 비선점이라 한번 시작하면 끝까지 갑니다.",
 "SRT":"남은 실행시간이 가장 짧은 것을 실행합니다. 새 프로세스가 도착할 때마다 다시 비교해 더 짧으면 선점합니다.",
 "RR":"시간 할당량만큼씩 돌아가며 실행합니다. 같은 시각에 새로 도착한 프로세스가 할당량을 다 쓴 프로세스보다 먼저 큐에 들어갑니다.",
 "HRN":"(대기시간 + 실행시간) ÷ 실행시간이 가장 큰 것을 실행합니다. 비선점."};
function genCpu(){
  const alg=pick(Object.keys(CPU_DESC)); const q=pick([2,3,4]); const N=4; let ps=[];
  const arr=[0]; for(let i=1;i<N;i++) arr.push(R(0,7)); arr.sort((a,b)=>a-b);
  for(let i=0;i<N;i++) ps.push({n:"P"+(i+1),a:arr[i],b:R(1,8)});
  const segs=[]; const rem=Object.fromEntries(ps.map(p=>[p.n,p.b])); const fin={}; let t=0; const notes=[];
  const push=(n,s,e)=>{ const l=segs[segs.length-1]; if(l&&l.n===n&&l.e===s) l.e=e; else segs.push({n,s,e}); };
  if(alg==="RR"){
    const Q=[]; let i=0; const order=ps.slice();
    const admit=()=>{ while(i<order.length&&order[i].a<=t){Q.push(order[i].n);i++;} };
    admit();
    while(Object.keys(fin).length<N){
      if(!Q.length){ t=order[i].a; admit(); continue; }
      const n=Q.shift(); const run=Math.min(q,rem[n]); push(n,t,t+run); t+=run; rem[n]-=run; admit();
      if(rem[n]===0) fin[n]=t; else Q.push(n);
    }
  } else if(alg==="SRT"){
    while(Object.keys(fin).length<N){
      const av=ps.filter(p=>p.a<=t&&!(p.n in fin));
      if(!av.length){ t=Math.min(...ps.filter(p=>!(p.n in fin)).map(p=>p.a)); continue; }
      av.sort((x,y)=>rem[x.n]-rem[y.n]||x.a-y.a); const p=av[0]; push(p.n,t,t+1); t++; rem[p.n]--; if(!rem[p.n]) fin[p.n]=t;
    }
  } else {
    while(Object.keys(fin).length<N){
      const av=ps.filter(p=>p.a<=t&&!(p.n in fin));
      if(!av.length){ t=Math.min(...ps.filter(p=>!(p.n in fin)).map(p=>p.a)); continue; }
      let p;
      if(alg==="FCFS") p=av.sort((x,y)=>x.a-y.a)[0];
      if(alg==="SJF") p=av.sort((x,y)=>x.b-y.b||x.a-y.a)[0];
      if(alg==="HRN"){ const sc=av.map(x=>({x,r:((t-x.a)+x.b)/x.b})); sc.sort((u,v)=>v.r-u.r||u.x.a-v.x.a); p=sc[0].x;
        if(av.length>1) notes.push(`t=${t}: `+sc.map(o=>`${o.x.n} (${t-o.x.a}+${o.x.b})/${o.x.b}=${o.r.toFixed(2)}`).join(", ")+` → ${p.n}`); }
      push(p.n,t,t+p.b); t+=p.b; fin[p.n]=t;
    }
  }
  let tot=0; const rows=ps.map(p=>{ const ta=fin[p.n]-p.a, w=ta-p.b; tot+=w; return `<tr><td>${p.n}</td><td>${p.a}</td><td>${p.b}</td><td>${fin[p.n]}</td><td>${ta}</td><td><b>${w}</b></td></tr>`; }).join("");
  const T=segs[segs.length-1].e, s0=segs[0].s;
  // gantt with idle
  let g=[], last=0; segs.forEach(s=>{ if(s.s>last) g.push({n:"–",s:last,e:s.s}); g.push(s); last=s.e; });
  const gantt=`<div style="padding:0 12px"><div class="gantt">${g.map(s=>`<div style="flex:${s.e-s.s};${s.n==="–"?"color:var(--muted)":""}">${s.n}</div>`).join("")}</div>
    <div class="gticks">${[...new Set(g.flatMap(s=>[s.s,s.e]))].map(x=>`<span style="left:${x/T*100}%">${x}</span>`).join("")}</div></div>`;
  const algName = alg==="RR"?`RR (할당량 ${q})`:alg;
  return {alg:algName, desc:CPU_DESC[alg], ask:"대기시간 총합",
    html:`<table class="mono" style="border-collapse:collapse;font-size:14px;margin:6px 0">${["<tr><th style='padding:4px 10px;border:1px solid var(--line)'>프로세스</th><th style='padding:4px 10px;border:1px solid var(--line)'>도착</th><th style='padding:4px 10px;border:1px solid var(--line)'>실행</th></tr>"].concat(ps.map(p=>`<tr><td style="padding:4px 10px;border:1px solid var(--line)">${p.n}</td><td style="padding:4px 10px;border:1px solid var(--line)">${p.a}</td><td style="padding:4px 10px;border:1px solid var(--line)">${p.b}</td></tr>`)).join("")}</table><p>문맥 교환 오버헤드는 없습니다. 같은 조건이면 먼저 도착한 프로세스가 우선입니다. <b>대기시간 총합</b>은?</p>`,
    answer:tot,
    trace:`${gantt}<table style="margin-top:22px"><tr><th>P</th><th>AT<br>도착</th><th>BT<br>실행</th><th>CT<br>종료</th><th>TAT<br>CT−AT</th><th>WT<br>TAT−BT</th></tr>${rows}</table>${notes.length?`<div class="step">${notes.join("\n")}</div>`:""}<div class="step">대기시간 총합 = ${tot}, 평균 = ${(tot/N).toFixed(2)}</div>`};
}

/* recovery */
function genRec(){
  const mode=pick(["즉시 갱신","지연 갱신"]); const CP=50, FAIL=100; const names=["T1","T2","T3","T4","T5"];
  const kinds=["preCommit","cpCommit","cpActive","postCommit","postActive"].concat(mode==="지연 갱신"?["cpAbort"]:[]);
  let chosen=[]; while(chosen.length<5){ chosen.push(pick(kinds)); }
  if(!chosen.includes("preCommit")) chosen[R(0,4)]="preCommit";
  const tx=chosen.map((k,i)=>{
    let s,e,end; // end: 'commit','abort',null
    if(k==="preCommit"){ s=R(5,25); e=R(s+8,45); end="commit"; }
    if(k==="cpCommit"){ s=R(5,40); e=R(58,92); end="commit"; }
    if(k==="cpActive"){ s=R(5,40); e=FAIL; end=null; }
    if(k==="postCommit"){ s=R(55,72); e=R(s+8,95); end="commit"; }
    if(k==="postActive"){ s=R(55,85); e=FAIL; end=null; }
    if(k==="cpAbort"){ s=R(5,60); e=R(Math.max(s+8,58),92); end="abort"; }
    let ans;
    if(end==="commit") ans = e<CP ? "무조치" : "Redo";
    else if(end==="abort") ans = mode==="즉시 갱신" ? "Undo" : "무조치";
    else ans = mode==="즉시 갱신" ? "Undo" : "무조치";
    return {name:names[i],s,e,end,ans,k};
  });
  const W=360,H=40+tx.length*30, x=v=>32+v/110*(W-44);
  let svg=`<svg class="tl" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">`;
  svg+=`<line x1="${x(CP)}" y1="14" x2="${x(CP)}" y2="${H-14}" stroke="var(--primary)" stroke-width="2" stroke-dasharray="6,4"/><text x="${x(CP)}" y="11" font-size="11.5" text-anchor="middle" fill="var(--primary)" font-weight="700">체크포인트</text>`;
  svg+=`<line x1="${x(FAIL)}" y1="14" x2="${x(FAIL)}" y2="${H-14}" stroke="var(--bad)" stroke-width="2.5"/><text x="${x(FAIL)}" y="11" font-size="11.5" text-anchor="middle" fill="var(--bad)" font-weight="700">장애</text>`;
  tx.forEach((t,i)=>{ const y=34+i*30; const col=t.end==="commit"?"var(--ok)":(t.end==="abort"?"var(--warn)":"var(--bad)");
    svg+=`<text x="2" y="${y+4}" font-size="12.5" font-weight="700" fill="var(--ink)">${t.name}</text><circle cx="${x(t.s)}" cy="${y}" r="4" fill="${col}"/><line x1="${x(t.s)}" y1="${y}" x2="${x(t.e)}" y2="${y}" stroke="${col}" stroke-width="3"/>`;
    if(t.end) svg+=`<text x="${x(t.e)-3}" y="${y-6}" text-anchor="end" font-size="10.5" fill="${col}" font-weight="700">${t.end}</text>`; });
  svg+=`</svg>`;
  const why=t=>{
    if(t.end==="commit"&&t.e<CP) return "체크포인트 전에 commit → 이미 디스크 반영, 회복 대상 아님";
    if(t.end==="commit") return "장애 전 commit, 체크포인트 이후 → 디스크 반영 보장 안 됨 → Redo";
    if(t.end==="abort") return mode==="즉시 갱신"?"abort(롤백) 기록만 있고 commit 없음 → 즉시 갱신이라 썼던 값 되돌림 → Undo":"commit 없음 → 지연 갱신은 DB에 쓴 적이 없으니 무조치";
    return mode==="즉시 갱신"?"장애 때 실행 중, commit 없음 → Undo":"장애 때 실행 중, commit 없음 → 지연 갱신이라 로그만 버림 → 무조치";
  };
  return {alg:mode, desc: mode==="즉시 갱신"?"연산 즉시 DB에 반영합니다. commit 없는 트랜잭션은 Undo, commit 있는 트랜잭션은 Redo가 필요할 수 있습니다.":"commit 이후에만 DB에 반영합니다. Undo가 필요 없고 commit 있는 트랜잭션만 Redo 대상입니다.",
    html:`${svg}<p>각 트랜잭션의 회복 연산을 고르세요.</p>`, tx,
    trace:`<table><tr><th>T</th><th>정답</th><th>이유</th></tr>${tx.map(t=>`<tr><td>${t.name}</td><td><b>${t.ans}</b></td><td style="text-align:left;white-space:normal">${why(t)}</td></tr>`).join("")}</table><div class="step">판정 순서: ① 장애 전 commit 있나? ② 그 commit이 체크포인트보다 앞인가? ③ commit 없으면 즉시 갱신은 Undo, 지연 갱신은 무조치</div>`};
}

$("#reset").onclick=()=>{ if(confirm("회상 기록을 모두 지울까요?")){ S.rec={}; save(); route(); } };
route();
</script>
</body>
</html>
