<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>개념 회상</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --ink:#2B3245; --muted:#6B7285; --line:#E1E4EE;
  --primary:#5F75BE; --primary-soft:#EBEFFB; --primary-ink:#FFFFFF;
  --ok:#3F8F67; --ok-soft:#E9F6EF; --bad:#C46A6A; --bad-soft:#FCEFEF;
  --warn:#b8872a; --warn-soft:#fbf1dc; --mix:#5b83c4; --mix-soft:#e3ecfa;
  --radius-l:18px; --radius-s:10px;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#191C26; --surface:#222634; --ink:#E7EAF3; --muted:#A3A9BC; --line:#343A4C;
    --primary:#A9BBEB; --primary-soft:#2C3349; --primary-ink:#191C26;
    --ok:#8FD1AE; --ok-soft:#21382D; --bad:#EDA9A9; --bad-soft:#3D2A2E;
    --warn:#e2b55e; --warn-soft:#352c19; --mix:#8fb0e6; --mix-soft:#1f2a3b; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* header */
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 2px 12px}
header.top h1{font-size:21px;margin:0;letter-spacing:-.02em}
header.top .stat{font-size:13px;color:var(--muted)}

.home{display:inline-block;color:var(--primary);text-decoration:none;font-weight:600;font-size:14px;padding:2px 0 4px}
/* subject segmented */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .inner{display:flex;width:100%;max-width:680px}
nav.tabs button{flex:1;border:0;background:none;padding:6px 0 4px;font-size:12.5px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--primary);font-weight:700}

/* lists */
.unit-list{display:flex;flex-direction:column;gap:8px}
.unit{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.unit .t{flex:1;font-weight:600;font-size:15.5px}
.unit .s{font-size:12.5px;color:var(--muted)}
.meter{width:54px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:0 0 auto}
.meter i{display:block;height:100%;background:var(--ok)}

/* note view */
.back{border:0;background:none;color:var(--primary);padding:4px 0 10px;cursor:pointer;font-weight:600}
.note h2{font-size:20px;margin:4px 0 12px;letter-spacing:-.01em}
.note h3{font-size:16.5px;margin:22px 0 8px}
.note p,.note li{font-size:15.5px}
.note ul{padding-left:20px}
.note strong{font-weight:700}
.note table{border-collapse:collapse;width:100%;font-size:13.5px;margin:10px 0;display:block;overflow-x:auto}
.note th,.note td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.note th{background:var(--primary-soft)}
.note blockquote{margin:12px 0;padding:10px 14px;border-radius:var(--radius-s);background:var(--warn-soft);border-left:4px solid var(--warn)}
.note blockquote p{margin:4px 0}
.note pre{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.45}
.note code{font-family:var(--mono);font-size:.9em;background:var(--primary-soft);padding:1px 5px;border-radius:5px}
.note pre code{background:none;padding:0}
.note hr{border:0;border-top:1px dashed var(--line);margin:22px 0}
.fig{background:#fff;border-radius:var(--radius-s);padding:8px;margin:12px 0;border:1px solid var(--line);overflow-x:auto}
.fig svg,.fig img{display:block;width:100%;height:auto;min-width:520px}
.note-cta{display:flex;gap:8px;margin-top:22px}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;font-size:15px}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:var(--primary-soft);color:var(--primary)}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* recall card — the one bold element */
.deckbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--primary);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:22px 20px;min-height:260px;display:flex;flex-direction:column}
.card .unit-tag{font-size:12.5px;color:var(--primary);font-weight:700;margin-bottom:10px}
.card .q{font-size:20px;font-weight:700;line-height:1.45;letter-spacing:-.01em}
.card .hint{margin-top:auto;padding-top:22px;font-size:13px;color:var(--muted)}
.reveal{margin-top:14px;display:none}
.reveal.on{display:block;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.reveal.on{animation:none}.progress i{transition:none}}
.blk{border-radius:var(--radius-s);padding:12px 14px;margin-top:10px;font-size:15.5px}
.blk .lb{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px}
.blk.ans{background:var(--primary-soft)} .blk.ans .lb{color:var(--primary)}
.blk.ex{background:var(--ok-soft)} .blk.ex .lb{color:var(--ok)}
.blk.trap{background:var(--warn-soft)} .blk.trap .lb{color:var(--warn)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.grade button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 8px;cursor:pointer;font-weight:700;font-size:14.5px}
.grade .g-ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft);grid-column:1 / -1}
.grade .g-recall{border-color:var(--bad);color:var(--bad)}
.grade .g-mix{border-color:var(--mix);color:var(--mix)}
.grade .g-new{border-color:var(--muted);color:var(--muted);grid-column:1 / -1}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:40px;font-weight:800;letter-spacing:-.03em}

/* settings in recall */
.opts{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:14px;margin-bottom:14px}
.opts label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.opts select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:14.5px;margin-bottom:12px}
.chk input{width:18px;height:18px;accent-color:var(--primary)}

/* calc */
.calc-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.calc-pick button{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:12px;text-align:left;cursor:pointer}
.calc-pick button b{display:block;font-size:15px}
.calc-pick button span{font-size:12.5px;color:var(--muted)}
.calc-pick button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.prob{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:18px}
.prob .alg{display:inline-block;background:var(--primary);color:var(--primary-ink);border-radius:8px;padding:2px 10px;font-weight:700;font-size:14px;margin-bottom:8px}
.prob .alg-desc{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.prob p{margin:6px 0;font-size:15.5px}
.mono{font-family:var(--mono)}
.ansrow{display:flex;gap:8px;margin-top:14px}
.ansrow input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:17px}
.verdict{margin-top:12px;border-radius:12px;padding:12px 14px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.trace{margin-top:12px;overflow-x:auto}
.trace table{border-collapse:collapse;font-size:13px;min-width:100%}
.trace th,.trace td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
.trace th{background:var(--primary-soft)}
.trace td.f{background:var(--bad-soft);color:var(--bad);font-weight:700}
.trace .step{font-family:var(--mono);font-size:13px;white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px}
.gantt{display:flex;margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:100%}
.gantt div{border-right:1px solid var(--line);text-align:center;font-size:12px;padding:6px 0;font-weight:700}
.gantt div:last-child{border-right:0}
.gticks{position:relative;height:18px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.gticks span{position:absolute;transform:translateX(-50%)}
.rec-q{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.rec-q b{width:30px}
.rec-q button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer;font-weight:600;font-size:14px}
.rec-q button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.rec-q .mark{font-size:13px;font-weight:700}
.tl{width:100%;height:auto;display:block;margin:8px 0}
details.cheat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 14px;margin-bottom:14px}
details.cheat summary{cursor:pointer;font-weight:700;font-size:14.5px}

/* weak */
.wk-group h3{font-size:15px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.wk-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;margin-bottom:6px;font-size:14.5px}
.wk-item small{display:block;color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:15px}
.foot{font-size:12px;color:var(--muted);margin-top:28px;text-align:center}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="../">‹ 기출 풀이</a>
  <header class="top"><h1>개념 회상</h1><span class="stat" id="stat"></span></header>
  <div class="seg" id="seg" role="group" aria-label="과목"></div>
  <main id="view"></main>
  <p class="foot">기록은 이 기기의 브라우저에만 저장됩니다. <button class="linkbtn" id="reset">기록 지우기</button></p>
</div>

<script>
const UNITS = [{"id": "db1", "subject": "db", "subjectName": "데이터베이스", "title": "3단계 스키마 · 데이터 독립성", "html": "<p><strong>한 칼 구분: 논리는 위쪽 경계(외부–개념), 물리는 아래쪽 경계(개념–내부)</strong></p>\n<ul>\n<li><strong>논리적 독립성</strong> = <strong>개념</strong> 스키마가 바뀌어도 → 외부 스키마(응용) 영향 X</li>\n<li><strong>물리적 독립성</strong> = <strong>내부</strong> 스키마가 바뀌어도 → 개념 스키마 영향 X</li>\n</ul>\n<div class=\"fig\"><svg viewBox=\"0 0 720 440\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK KR\">\n<g font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">\n<circle cx=\"150\" cy=\"28\" r=\"10\" fill=\"#f0f0f0\" stroke=\"#888\"/><text x=\"150\" y=\"55\">사용자 A</text>\n<circle cx=\"270\" cy=\"28\" r=\"10\" fill=\"#f0f0f0\" stroke=\"#888\"/><text x=\"270\" y=\"55\">사용자 B</text>\n<circle cx=\"390\" cy=\"28\" r=\"10\" fill=\"#f0f0f0\" stroke=\"#888\"/><text x=\"390\" y=\"55\">응용 프로그램</text></g>\n<g stroke=\"#888\" stroke-width=\"1.5\"><line x1=\"150\" y1=\"60\" x2=\"150\" y2=\"80\"/><line x1=\"270\" y1=\"60\" x2=\"270\" y2=\"80\"/><line x1=\"390\" y1=\"60\" x2=\"390\" y2=\"80\"/></g>\n<g font-size=\"13\" text-anchor=\"middle\" fill=\"#1e3a8a\">\n<rect x=\"100\" y=\"80\" width=\"100\" height=\"44\" rx=\"6\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"150\" y=\"106\">외부 스키마 1</text>\n<rect x=\"220\" y=\"80\" width=\"100\" height=\"44\" rx=\"6\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"270\" y=\"106\">외부 스키마 2</text>\n<rect x=\"340\" y=\"80\" width=\"100\" height=\"44\" rx=\"6\" fill=\"#dbeafe\" stroke=\"#2563eb\" stroke-width=\"1.5\"/><text x=\"390\" y=\"106\">외부 스키마 3</text></g>\n<text x=\"460\" y=\"98\" font-size=\"12.5\" fill=\"#2563eb\" font-weight=\"bold\">← VIEW · DTO</text><text x=\"460\" y=\"116\" font-size=\"12\" fill=\"#2563eb\">여러 개 가능</text>\n<g stroke=\"#888\" stroke-width=\"1.5\"><line x1=\"150\" y1=\"124\" x2=\"240\" y2=\"188\"/><line x1=\"270\" y1=\"124\" x2=\"270\" y2=\"188\"/><line x1=\"390\" y1=\"124\" x2=\"300\" y2=\"188\"/></g>\n<rect x=\"80\" y=\"140\" width=\"380\" height=\"30\" rx=\"15\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-dasharray=\"5,3\"/>\n<text x=\"270\" y=\"160\" font-size=\"13\" text-anchor=\"middle\" fill=\"#92400e\" font-weight=\"bold\">논리적 독립성 : 개념 변경 → 외부 영향 X (위쪽 경계)</text>\n<rect x=\"140\" y=\"188\" width=\"260\" height=\"50\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<text x=\"270\" y=\"209\" font-size=\"14\" text-anchor=\"middle\" fill=\"#14532d\" font-weight=\"bold\">개념 스키마</text>\n<text x=\"270\" y=\"228\" font-size=\"12\" text-anchor=\"middle\" fill=\"#14532d\">조직 전체 논리 구조 · DB당 1개</text>\n<text x=\"410\" y=\"210\" font-size=\"12.5\" fill=\"#16a34a\" font-weight=\"bold\">← 테이블 · @Entity</text><text x=\"410\" y=\"228\" font-size=\"12\" fill=\"#16a34a\">딱 하나 (원본)</text>\n<line x1=\"270\" y1=\"238\" x2=\"270\" y2=\"300\" stroke=\"#888\" stroke-width=\"1.5\"/>\n<rect x=\"80\" y=\"252\" width=\"380\" height=\"30\" rx=\"15\" fill=\"#fef3c7\" stroke=\"#d97706\" stroke-dasharray=\"5,3\"/>\n<text x=\"270\" y=\"272\" font-size=\"13\" text-anchor=\"middle\" fill=\"#92400e\" font-weight=\"bold\">물리적 독립성 : 내부 변경 → 개념 영향 X (아래쪽 경계)</text>\n<rect x=\"140\" y=\"300\" width=\"260\" height=\"50\" rx=\"6\" fill=\"#fce7f3\" stroke=\"#db2777\" stroke-width=\"2\"/>\n<text x=\"270\" y=\"321\" font-size=\"14\" text-anchor=\"middle\" fill=\"#831843\" font-weight=\"bold\">내부 스키마</text>\n<text x=\"270\" y=\"340\" font-size=\"12\" text-anchor=\"middle\" fill=\"#831843\">저장 구조 · 인덱스 · 레코드 배치</text>\n<text x=\"410\" y=\"322\" font-size=\"12.5\" fill=\"#db2777\" font-weight=\"bold\">← 인덱스 · 디스크</text><text x=\"410\" y=\"340\" font-size=\"12\" fill=\"#db2777\">내가 접근 못 하는 영역</text>\n<line x1=\"270\" y1=\"350\" x2=\"270\" y2=\"378\" stroke=\"#888\" stroke-width=\"1.5\"/>\n<ellipse cx=\"270\" cy=\"386\" rx=\"55\" ry=\"10\" fill=\"#e5e7eb\" stroke=\"#6b7280\"/><rect x=\"215\" y=\"386\" width=\"110\" height=\"34\" fill=\"#e5e7eb\" stroke=\"none\"/>\n<line x1=\"215\" y1=\"386\" x2=\"215\" y2=\"420\" stroke=\"#6b7280\"/><line x1=\"325\" y1=\"386\" x2=\"325\" y2=\"420\" stroke=\"#6b7280\"/>\n<ellipse cx=\"270\" cy=\"420\" rx=\"55\" ry=\"10\" fill=\"#e5e7eb\" stroke=\"#6b7280\"/><rect x=\"216\" y=\"387\" width=\"108\" height=\"32\" fill=\"#e5e7eb\"/>\n<text x=\"270\" y=\"410\" font-size=\"12\" text-anchor=\"middle\" fill=\"#374151\">물리적 DB (디스크)</text>\n<rect x=\"560\" y=\"150\" width=\"150\" height=\"150\" rx=\"8\" fill=\"#f9fafb\" stroke=\"#9ca3af\"/>\n<g font-size=\"12\" fill=\"#111\"><text x=\"572\" y=\"174\" font-weight=\"bold\">헷갈리면 질문 하나</text>\n<text x=\"572\" y=\"198\">\"여러 개 만들 수 있나?\"</text>\n<text x=\"572\" y=\"226\" fill=\"#1e3a8a\">여러 개 → 외부</text><text x=\"572\" y=\"246\" fill=\"#14532d\">하나뿐인 원본 → 개념</text>\n<text x=\"572\" y=\"274\" fill=\"#92400e\">논리 = 위, 물리 = 아래</text></g>\n</svg>\n</div>\n<table>\n<thead>\n<tr>\n<th>스키마</th>\n<th>관점</th>\n<th>키워드</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>외부 (External)</td>\n<td>사용자·응용 프로그램</td>\n<td>뷰(View), 서브스키마, 여러 개 존재 가능</td>\n</tr>\n<tr>\n<td>개념 (Conceptual)</td>\n<td>조직 전체</td>\n<td>전체 논리 구조, 접근권한·제약조건, <strong>DB당 1개</strong></td>\n</tr>\n<tr>\n<td>내부 (Internal)</td>\n<td>물리적 저장</td>\n<td>저장 구조, 인덱스, 레코드 배치</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>⚠️ 선지함정\n- \"개념 스키마는 여러 개 존재할 수 있다\" → X (외부만 여러 개)\n- 인덱스 추가/저장장치 변경 = <strong>물리적</strong> 독립성 문제\n- 테이블에 컬럼 추가해도 기존 응용 안 고침 = <strong>논리적</strong> 독립성</p>\n</blockquote>\n<p><strong>Spring 앵커 (네가 확정한 멘탈모델)</strong></p>\n<table>\n<thead>\n<tr>\n<th>단계</th>\n<th>내 실무</th>\n<th>개수</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>외부</td>\n<td><code>VIEW</code>, <strong>DTO</strong> (용도별로 입맛대로 가공)</td>\n<td>여러 개</td>\n</tr>\n<tr>\n<td>개념</td>\n<td><strong>실제 테이블 · <code>@Entity</code></strong> (원본)</td>\n<td>하나</td>\n</tr>\n<tr>\n<td>내부</td>\n<td>인덱스 · 디스크 (내가 접근 못 하는 영역)</td>\n<td>하나</td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>헷갈리면 질문 하나: <strong>\"이거 여러 개 만들 수 있나?\"</strong> → 여러 개면 외부(VIEW·DTO), 하나뿐인 원본이면 개념</li>\n<li>~~개념 = DTO~~ → DTO는 API마다 여러 개(<code>EmpListDto</code>, <code>EmpDetailDto</code>…) 만드니까 <strong>외부</strong></li>\n<li><code>@Entity</code>는 엄밀히는 DB 테이블 정의를 자바로 비춘 ORM 매핑 → <strong>기억용 앵커</strong>로만 쓰고, 답은 교재 표현(\"조직 전체의 논리 구조, DB당 1개\")으로</li>\n<li>실무 체감: <code>CREATE INDEX</code> 해도 쿼리 한 글자 안 바뀜 = <strong>물리적 독립성</strong> / <code>ALTER TABLE ADD COLUMN</code> 해도 기존 뷰·API 안 터짐 = <strong>논리적 독립성</strong> (<code>SELECT *</code>는 이걸 깨먹는 안티패턴)</li>\n<li>VIEW로 조회 중이면 그 순간엔 외부 스키마를 보는 것, 테이블 정의 자체를 보면 개념</li>\n</ul>\n<p>오답노트 한 줄: <code>외부=VIEW·DTO(여러개) / 개념=Entity(하나) / 내부=접근불가, 논리=외부-개념 / 물리=개념-내부</code></p>"}, {"id": "db2", "subject": "db", "subjectName": "데이터베이스", "title": "릴레이션 용어", "html": "<p><strong>[학생] 릴레이션 = 테이블 전체</strong></p>\n<div class=\"fig\"><svg viewBox=\"0 0 720 420\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK KR\">\n<text x=\"150\" y=\"36\" font-size=\"15\" font-weight=\"bold\" fill=\"#111\">[학생] 릴레이션 = 테이블 전체</text>\n<path d=\"M 150 88 L 150 78 L 480 78 L 480 88\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\"/>\n<text x=\"500\" y=\"86\" font-size=\"14\" font-weight=\"bold\" fill=\"#2563eb\">차수(Degree) = 3</text>\n<text x=\"500\" y=\"104\" font-size=\"12\" fill=\"#2563eb\">= 애트리뷰트(열) 개수 · 세로</text>\n<g stroke=\"#374151\" stroke-width=\"1.2\"><rect x=\"150\" y=\"96\" width=\"110\" height=\"40\" fill=\"#e0e7ff\"/><rect x=\"260\" y=\"96\" width=\"110\" height=\"40\" fill=\"#e0e7ff\"/><rect x=\"370\" y=\"96\" width=\"110\" height=\"40\" fill=\"#e0e7ff\"/></g>\n<g font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#312e81\"><text x=\"205\" y=\"121\">학번</text><text x=\"315\" y=\"121\">이름</text><text x=\"425\" y=\"121\">학과</text></g>\n<line x1=\"315\" y1=\"96\" x2=\"315\" y2=\"62\" stroke=\"#4338ca\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n<text x=\"330\" y=\"60\" font-size=\"13\" fill=\"#4338ca\" font-weight=\"bold\">애트리뷰트 = 열 (학번·이름·학과)</text>\n<g stroke=\"#374151\"><rect x=\"150\" y=\"136\" width=\"110\" height=\"36\" fill=\"#fff\"/><rect x=\"260\" y=\"136\" width=\"110\" height=\"36\" fill=\"#fff\"/><rect x=\"370\" y=\"136\" width=\"110\" height=\"36\" fill=\"#fff\"/>\n<rect x=\"150\" y=\"172\" width=\"110\" height=\"36\" fill=\"#fee2e2\"/><rect x=\"260\" y=\"172\" width=\"110\" height=\"36\" fill=\"#fee2e2\"/><rect x=\"370\" y=\"172\" width=\"110\" height=\"36\" fill=\"#fee2e2\"/>\n<rect x=\"150\" y=\"208\" width=\"110\" height=\"36\" fill=\"#fff\"/><rect x=\"260\" y=\"208\" width=\"110\" height=\"36\" fill=\"#fff\"/><rect x=\"370\" y=\"208\" width=\"110\" height=\"36\" fill=\"#fff\"/></g>\n<g font-size=\"13\" text-anchor=\"middle\"><text x=\"205\" y=\"159\">1001</text><text x=\"315\" y=\"159\">김철수</text><text x=\"425\" y=\"159\">컴공</text>\n<text x=\"205\" y=\"195\">1002</text><text x=\"315\" y=\"195\">이영희</text><text x=\"425\" y=\"195\">전자</text>\n<text x=\"205\" y=\"231\">1003</text><text x=\"315\" y=\"231\">박민수</text><text x=\"425\" y=\"231\">컴공</text></g>\n<path d=\"M 480 190 L 520 190\" stroke=\"#dc2626\" stroke-width=\"1.8\"/>\n<text x=\"528\" y=\"186\" font-size=\"13.5\" font-weight=\"bold\" fill=\"#dc2626\">튜플 = 행 1줄</text><text x=\"528\" y=\"204\" font-size=\"12\" fill=\"#dc2626\">(1002, 이영희, 전자)</text>\n<path d=\"M 138 136 L 128 136 L 128 244 L 138 244\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n<g text-anchor=\"end\" fill=\"#16a34a\"><text x=\"118\" y=\"180\" font-size=\"14\" font-weight=\"bold\">기수</text><text x=\"118\" y=\"198\" font-size=\"14\" font-weight=\"bold\">= 3</text>\n<text x=\"118\" y=\"220\" font-size=\"11.5\">(Cardinality)</text><text x=\"118\" y=\"236\" font-size=\"11.5\">튜플(행) 개수</text></g>\n<path d=\"M 425 244 L 425 282\" stroke=\"#d97706\" stroke-width=\"1.8\" stroke-dasharray=\"4,3\"/>\n<rect x=\"330\" y=\"284\" width=\"230\" height=\"46\" rx=\"8\" fill=\"#fef3c7\" stroke=\"#d97706\"/>\n<text x=\"445\" y=\"304\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#92400e\">도메인 = 학과가 가질 수 있는 값의 집합</text>\n<text x=\"445\" y=\"322\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#92400e\">{컴공, 전자, 기계, ...}</text>\n<rect x=\"60\" y=\"352\" width=\"600\" height=\"58\" rx=\"8\" fill=\"#f9fafb\" stroke=\"#9ca3af\"/>\n<text x=\"76\" y=\"375\" font-size=\"13\" font-weight=\"bold\">한 칼 구분 : 차수 = 세로(열 개수) · 기수 = 가로(행 개수)</text>\n<text x=\"76\" y=\"396\" font-size=\"12.5\" fill=\"#374151\">릴레이션 특성 : 튜플 순서 없음 · 튜플 중복 없음 · 애트리뷰트는 원자값</text>\n</svg>\n</div>\n<table>\n<thead>\n<tr>\n<th>용어</th>\n<th>이 테이블에서</th>\n<th>값</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>릴레이션</td>\n<td>테이블 전체</td>\n<td>학생</td>\n</tr>\n<tr>\n<td>튜플 (Tuple)</td>\n<td>행 1줄</td>\n<td>(1001, 김철수, 컴공)</td>\n</tr>\n<tr>\n<td>애트리뷰트</td>\n<td>열 이름</td>\n<td>학번, 이름, 학과</td>\n</tr>\n<tr>\n<td>도메인</td>\n<td>한 애트리뷰트가 가질 수 있는 값의 집합</td>\n<td>학과 도메인 = {컴공, 전자, ...}</td>\n</tr>\n<tr>\n<td><strong>차수 (Degree)</strong></td>\n<td><strong>애트리뷰트 개수</strong></td>\n<td><strong>3</strong></td>\n</tr>\n<tr>\n<td><strong>기수 (Cardinality)</strong></td>\n<td><strong>튜플 개수</strong></td>\n<td><strong>3</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>한 칼 구분: 차수=세로(열), 기수=가로(행). \"차렷! 세로로 서!\" → 차수는 세로.</strong></p>\n<blockquote>\n<p>⚠️ 릴레이션 특성 선지: 튜플 간 <strong>순서 없음</strong>, 튜플 <strong>중복 없음</strong>, 애트리뷰트는 <strong>원자값</strong>. \"튜플은 삽입 순서를 유지한다\" → X</p>\n</blockquote>"}, {"id": "db3", "subject": "db", "subjectName": "데이터베이스", "title": "키 · 무결성", "html": "<p><strong>한 칼 구분: 슈퍼키 = 유일성만. 후보키 = 유일성 + 최소성. 기본키 = 후보키 중 뽑힌 1개. 대체키 = 안 뽑힌 나머지.</strong></p>\n<pre><code>슈퍼키 ⊃ 후보키 = { 기본키(1개) + 대체키(나머지) }\n</code></pre>\n<table>\n<thead>\n<tr>\n<th>키</th>\n<th>유일성</th>\n<th>최소성</th>\n<th>비고</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>슈퍼키</td>\n<td>O</td>\n<td>X여도 됨</td>\n<td>(학번+이름)도 슈퍼키</td>\n</tr>\n<tr>\n<td>후보키</td>\n<td>O</td>\n<td>O</td>\n<td>기본키 자격 있는 것들</td>\n</tr>\n<tr>\n<td>기본키</td>\n<td>O</td>\n<td>O</td>\n<td><strong>NULL 불가, 중복 불가</strong></td>\n</tr>\n<tr>\n<td>대체키</td>\n<td>O</td>\n<td>O</td>\n<td>후보키 − 기본키</td>\n</tr>\n<tr>\n<td>외래키</td>\n<td>—</td>\n<td>—</td>\n<td>다른 릴레이션의 기본키 참조. <strong>NULL 가능</strong>, 중복 가능</td>\n</tr>\n</tbody>\n</table>\n<p><strong>예시 문제</strong>: 학생(학번, 주민번호, 이름, 학과), 학번·주민번호 각각 유일.</p>\n<ul>\n<li>후보키: {학번}, {주민번호} → 2개</li>\n<li>기본키를 학번으로 → 대체키 = 주민번호</li>\n<li>(학번, 이름)은? → 슈퍼키 O, 후보키 X (최소성 위반)</li>\n</ul>\n<blockquote>\n<p>⚠️ 선지함정\n- \"외래키는 NULL을 가질 수 없다\" → X (기본키가 NULL 불가)\n- \"후보키는 릴레이션에 하나만 존재한다\" → X (기본키가 1개)\n- 무결성 연결: 개체 무결성=기본키 NULL·중복 X / 참조 무결성=외래키는 참조 릴레이션의 기본키 값 or NULL</p>\n</blockquote>"}, {"id": "db4", "subject": "db", "subjectName": "데이터베이스", "title": "정규화 (1NF → BCNF)", "html": "<p><strong>한 칼 구분: \"원자값(1) → 부분 제거(2) → 이행 제거(3) → 결정자가 전부 후보키(BCNF)\"</strong>\n암기: <strong>원-부-이-결</strong> (도부이결로도 외움: 도메인 원자값 / 부분 / 이행 / 결정자)</p>\n<table>\n<thead>\n<tr>\n<th>단계</th>\n<th>제거 대상</th>\n<th>판정 질문</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1NF</td>\n<td>반복 그룹, 다중값</td>\n<td>모든 값이 원자값인가?</td>\n</tr>\n<tr>\n<td>2NF</td>\n<td><strong>부분 함수 종속</strong></td>\n<td>복합키의 <strong>일부</strong>에만 종속된 속성 있나?</td>\n</tr>\n<tr>\n<td>3NF</td>\n<td><strong>이행 함수 종속</strong></td>\n<td>키 아닌 속성 → 키 아닌 속성 있나? (A→B→C)</td>\n</tr>\n<tr>\n<td>BCNF</td>\n<td>후보키 아닌 결정자</td>\n<td><strong>모든 결정자가 후보키인가?</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>알파벳 예시 3종 — 표로 한눈에</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>릴레이션 · 키</th>\n<th>함수 종속(FD)</th>\n<th>걸리는 곳</th>\n<th>결론</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>예시 1</strong></td>\n<td>R(A,B,C,D), 키 (A,B)</td>\n<td>(A,B)→C, <strong>B→D</strong></td>\n<td>D가 키의 <strong>일부(B)</strong>에만 종속 = 부분 종속</td>\n<td><strong>1NF</strong>, 2NF 위반</td>\n</tr>\n<tr>\n<td><strong>예시 2</strong></td>\n<td>R(A,B,C), 키 A</td>\n<td>A→B, <strong>B→C</strong></td>\n<td>A→B→C <strong>이행</strong> 종속</td>\n<td><strong>2NF</strong>, 3NF 위반</td>\n</tr>\n<tr>\n<td><strong>예시 3</strong></td>\n<td>R(A,B,C), 후보키 (A,B)</td>\n<td>(A,B)→C, <strong>C→A</strong></td>\n<td>결정자 C가 <strong>후보키 아님</strong></td>\n<td><strong>3NF</strong>, BCNF 위반</td>\n</tr>\n</tbody>\n</table>\n<p><strong>풀이 시작점</strong>: ① 후보키 확정 → ② FD 좌변(결정자) 하나씩 보며 \"부분? 이행? 결정자=후보키?\" 순서로 아래에서 위로 판정.</p>\n<blockquote>\n<p>⚠️ 선지함정: \"정규화하면 조인 연산이 줄어든다\" → X (테이블 분해 → 조인 <strong>증가</strong>). 정규화 목적 = 이상(삽입·삭제·갱신 Anomaly) 제거, 중복 최소화.</p>\n</blockquote>"}, {"id": "db5", "subject": "db", "subjectName": "데이터베이스", "title": "트랜잭션 ACID", "html": "<p><strong>한 칼 구분: 원자성은 트랜잭션 \"하나의 안\", 고립성은 트랜잭션 \"여럿 사이\".</strong></p>\n<table>\n<thead>\n<tr>\n<th>성질</th>\n<th>범위</th>\n<th>키워드</th>\n<th>담당 기법</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>원자성 (Atomicity)</td>\n<td>트랜잭션 1개 내부</td>\n<td>All or Nothing, 부분 실행 X</td>\n<td><strong>회복 (Undo)</strong></td>\n</tr>\n<tr>\n<td>일관성 (Consistency)</td>\n<td>실행 전후 상태</td>\n<td>제약조건 유지</td>\n<td>무결성 제약</td>\n</tr>\n<tr>\n<td>고립성 (Isolation)</td>\n<td>동시 실행 트랜잭션 <strong>간</strong></td>\n<td>중간 결과 못 봄</td>\n<td><strong>동시성 제어 (락, 2PL)</strong></td>\n</tr>\n<tr>\n<td>지속성 (Durability)</td>\n<td>Commit 이후</td>\n<td>결과 영구 반영</td>\n<td>회복 (Redo)</td>\n</tr>\n</tbody>\n</table>\n<p>판정 요령: 지문에 \"<strong>계좌이체 중 장애로 출금만 반영</strong>\" → 원자성. \"<strong>두 트랜잭션이 동시에 접근해 중간값을 읽음</strong>\" → 고립성.</p>\n<ul>\n<li><strong>원자성 ↔ Undo</strong>(부분 실행 지우기), <strong>지속성 ↔ Redo</strong>(commit한 건 살리기) — 6번과 세트</li>\n</ul>\n<blockquote>\n<p>⚠️ 경계혼동 주의: 일관성 vs 고립성. 일관성은 \"결과 상태가 규칙을 지키는가\", 고립성은 \"실행 과정에서 서로 간섭 없는가\". (2PL은 고립성, 2PC는 분산 커밋 — 딴 놈이니 섞지 말 것)</p>\n</blockquote>"}, {"id": "db6", "subject": "db", "subjectName": "데이터베이스", "title": "회복 기법 · Undo/Redo", "html": "<h3>6-0. Undo · Redo가 뭔데?</h3>\n<p>장애 후 DB를 \"약속했던 상태\"로 맞추는 <strong>반대 방향 두 연산</strong>.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Undo (취소)</th>\n<th>Redo (재실행)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>대상</td>\n<td><strong>commit 안 한</strong> 트랜잭션</td>\n<td><strong>commit 한</strong> 트랜잭션</td>\n</tr>\n<tr>\n<td>의미</td>\n<td>없던 일로 만들기 (\"뒤로\")</td>\n<td>약속한 건 끝까지 반영 (\"앞으로\")</td>\n</tr>\n<tr>\n<td>로그에서 쓰는 값</td>\n<td><strong>옛 값 (old value)</strong></td>\n<td><strong>새 값 (new value)</strong></td>\n</tr>\n<tr>\n<td>지키는 성질</td>\n<td><strong>원자성</strong></td>\n<td><strong>지속성</strong></td>\n</tr>\n</tbody>\n</table>\n<p>예: 로그 <code>&lt;T, X, 10, 20&gt;</code> (X를 10→20)</p>\n<ul>\n<li>T가 commit 못 하고 죽음 → <strong>Undo</strong> → X = 10</li>\n<li>T가 commit 했는데 디스크엔 아직 10 → <strong>Redo</strong> → X = 20</li>\n</ul>\n<p>왜 필요? DBMS는 성능 때문에 변경을 버퍼(메모리)에 뒀다가 나중에 디스크에 씀 → 장애 순간 \"commit 안 했는데 이미 써진 것\"(Undo 대상)과 \"commit 했는데 아직 안 써진 것\"(Redo 대상)이 공존. 그래서 <strong>로그 먼저, 데이터 나중 = WAL (Write-Ahead Logging)</strong>.</p>\n<p>Spring 앵커: <code>@Transactional</code> 메서드가 예외로 롤백 = Undo / 커밋 응답 직후 서버가 죽어도 데이터 살아있음 = 재기동 시 Redo.</p>\n<p><strong>한 칼 구분: Undo = old로 뒤로, Redo = new로 앞으로. 기준은 오직 commit 로그 유무.</strong></p>\n<p><strong>commit · rollback · abort 위치 (트랜잭션 상태도)</strong></p>\n<div class=\"fig\"><svg viewBox=\"0 0 720 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Noto Sans CJK KR\">\n<rect x=\"20\" y=\"20\" width=\"110\" height=\"38\" rx=\"19\" fill=\"#e0e7ff\" stroke=\"#4f46e5\"/><text x=\"75\" y=\"44\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#312e81\" font-weight=\"bold\">활동 (Active)</text>\n<rect x=\"190\" y=\"20\" width=\"150\" height=\"38\" rx=\"19\" fill=\"#e0e7ff\" stroke=\"#4f46e5\"/><text x=\"265\" y=\"38\" font-size=\"12\" text-anchor=\"middle\" fill=\"#312e81\" font-weight=\"bold\">부분 완료</text><text x=\"265\" y=\"52\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#312e81\">(Partially Committed)</text>\n<rect x=\"410\" y=\"20\" width=\"140\" height=\"38\" rx=\"19\" fill=\"#dcfce7\" stroke=\"#16a34a\" stroke-width=\"2\"/><text x=\"480\" y=\"38\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#14532d\" font-weight=\"bold\">완료 (Committed)</text><text x=\"480\" y=\"52\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#14532d\">이후 장애 → Redo</text>\n<rect x=\"190\" y=\"90\" width=\"150\" height=\"36\" rx=\"18\" fill=\"#fee2e2\" stroke=\"#dc2626\"/><text x=\"265\" y=\"113\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#991b1b\" font-weight=\"bold\">실패 (Failed)</text>\n<rect x=\"410\" y=\"90\" width=\"140\" height=\"36\" rx=\"18\" fill=\"#fee2e2\" stroke=\"#dc2626\" stroke-width=\"2\"/><text x=\"480\" y=\"107\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#991b1b\" font-weight=\"bold\">철회 (Aborted)</text><text x=\"480\" y=\"121\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#991b1b\">Rollback 완료</text>\n<g stroke-width=\"2\"><line x1=\"130\" y1=\"39\" x2=\"186\" y2=\"39\" stroke=\"#4f46e5\"/><line x1=\"340\" y1=\"39\" x2=\"406\" y2=\"39\" stroke=\"#16a34a\"/><line x1=\"100\" y1=\"58\" x2=\"210\" y2=\"90\" stroke=\"#dc2626\"/><line x1=\"265\" y1=\"58\" x2=\"265\" y2=\"86\" stroke=\"#dc2626\"/><line x1=\"340\" y1=\"108\" x2=\"406\" y2=\"108\" stroke=\"#dc2626\"/></g>\n<path d=\"M 186 39 l -9 -5 v 10 z\" fill=\"#4f46e5\"/><path d=\"M 406 39 l -9 -5 v 10 z\" fill=\"#16a34a\"/><path d=\"M 210 90 l -11 -1 l 5 -9 z\" fill=\"#dc2626\"/><path d=\"M 265 86 l -5 -8 h 10 z\" fill=\"#dc2626\"/><path d=\"M 406 108 l -9 -5 v 10 z\" fill=\"#dc2626\"/>\n<text x=\"158\" y=\"32\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4f46e5\">연산 끝</text><text x=\"373\" y=\"32\" font-size=\"11\" text-anchor=\"middle\" fill=\"#16a34a\" font-weight=\"bold\">commit</text>\n<text x=\"120\" y=\"88\" font-size=\"10\" fill=\"#dc2626\">오류·장애</text><text x=\"373\" y=\"101\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#dc2626\" font-weight=\"bold\">rollback(Undo)</text>\n<g font-size=\"11\" fill=\"#334155\"><text x=\"570\" y=\"40\">commit = 확정</text><text x=\"570\" y=\"58\">rollback = 취소(Undo)</text><text x=\"570\" y=\"76\">abort = 철회된 상태</text><text x=\"570\" y=\"104\">부분 완료에서 장애</text><text x=\"570\" y=\"120\">→ 아직 commit 전 → Undo</text></g>\n</svg>\n</div>\n<ul>\n<li>commit = 확정 / rollback = 취소(Undo 수행) / abort = 실패 후 철회된 상태(또는 그 처리)</li>\n<li>부분 완료 = 마지막 연산은 끝났지만 아직 commit 전 → 여기서 장애 나도 <strong>Undo</strong></li>\n</ul>\n<h3>6-1. 지연갱신 vs 즉시갱신</h3>\n<p><strong>한 칼 구분: 지연 = DB에 아직 안 썼으니 지울 게 없다 → Undo 불필요. 즉시 = 이미 썼으니 되돌려야 한다 → Undo 필요.</strong></p>\n<table>\n<thead>\n<tr>\n<th>기법</th>\n<th>DB 반영 시점</th>\n<th>Commit <strong>전</strong> 장애</th>\n<th>Commit <strong>후</strong> 장애</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>지연 갱신 (Deferred)</strong></td>\n<td>Commit 후에 반영</td>\n<td>아무것도 안 함 (로그 버림)</td>\n<td><strong>Redo</strong></td>\n</tr>\n<tr>\n<td><strong>즉시 갱신 (Immediate)</strong></td>\n<td>연산 즉시 반영</td>\n<td><strong>Undo</strong></td>\n<td><strong>Redo</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>예시 문제</strong>: 즉시 갱신 로그가 아래와 같을 때 장애 발생. 각 트랜잭션 처리?</p>\n<pre><code>&lt;T1 start&gt; &lt;T1, X, 10, 20&gt; &lt;T1 commit&gt;\n&lt;T2 start&gt; &lt;T2, Y, 30, 40&gt;          ← 여기서 장애\n</code></pre>\n<p>→ T1: commit 기록 있음 → <strong>Redo</strong> / T2: commit 없음 → <strong>Undo</strong></p>\n<p><strong>풀이 시작점</strong>: 로그에서 <code>&lt;commit&gt;</code> 유무만 먼저 체크 → commit 있으면 Redo 후보, 없으면 (즉시갱신) Undo / (지연갱신) 무시.</p>\n<blockquote>\n<p>⚠️ 선지함정: \"지연 갱신은 Undo와 Redo 모두 필요하다\" → X (지연 갱신 = <strong>Redo만</strong>, NO-UNDO/REDO)\n- \"Redo는 old value를 사용한다\" → X (Redo=new, Undo=old)</p>\n</blockquote>\n<h3>6-2. 체크포인트 + 시스템 실패 (단골 그림)</h3>\n<div class=\"fig\"><img alt=\"체크포인트와 시스템 실패 시 트랜잭션별 회복 판정 그림\" src=\"data:image/webp;base64,UklGRrrUAABXRUJQVlA4IK7UAAAQ+wKdASpMBDYDPmEuk0ckIqIhJFKLGIAMCWVu/AAd9HWqT9oZ/7X+0O9V7oDyX0QpiXX/wP7r4dc6+9/3v97/d7/H+/Vyr4nfafvHsl/0vEj4r/reWj7L/Df+T/N/lH89f9l/4v9N/oPgj/Wf8z/7PcB/s39i/6P9+/yHwR/8/7e+6L+8f9/1A/0r/B/+j/P+79/u/2290H9w/2v7Yf675AP7N/df/F7VP/W/+PuS/4L/h/+73Cv5t/ef/p7Rv/e/dz4Uf7p/0/3S/7vyP/s1/9v+D/z/gA/+PtV/wD/4eoB6r/TX+w/3z9ePfn3wfZ/7l/if8b/dP/f61/i/y/9k/tH7N/2z/5/734W/4v/CePb0j+L/2P+d/z3sV/IPr790/t/+R/2/9y/eP7nfr3+O/w/+V/3f9v/aP2T+IH8b+X39+/eD7Bfyf+Xf33+xf47/f/4L95vct/ke2Z1T/Rf67/B+wL6ofNP9R/ff8j/0f8P6Ff7//c/8Z/6P7t///kX9I/r/+G/wn7mf3D/////9Af5N/Qv9F/cP8p/4/8V////t92f6P/2/5jyhPun+x/63+g/L77A/5d/a/+p/h/9b+230u/zn/X/zH+r/aj26fnv+W/7X+b/2X7V/YX/NP7F/y/8H/o//j/qP///9/vi///ut/eP///+T4df3V////sK+u5HcjuR3I7kdyO5HcjuR3I7kdyO5HcjuR3I7kdyO5
